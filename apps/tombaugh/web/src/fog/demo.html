<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tombaugh fog map demo</title>
<style>
  :root { --tb-ink: #171715; --tb-paper: #F7F2E7; --tb-signal: #E53C27; --tb-stone: #77766E; }
  html, body { margin: 0; background: var(--tb-ink); color: var(--tb-paper); }
  body { font: 15px/1.5 Arial, Helvetica, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font: 900 26px/1.15 "Arial Black", Arial, sans-serif; margin: 0 0 6px; letter-spacing: -0.01em; }
  .lede { margin: 0 0 18px; max-width: 62ch; color: rgba(247, 242, 231, 0.8); }
  .demo { margin-top: 26px; padding-top: 14px; border-top: 1px solid rgba(119, 118, 110, 0.4); }
  .demo h2 { font: 700 13px/1.3 Arial, sans-serif; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(247, 242, 231, 0.66); margin: 0 0 8px; }
  .demo button { appearance: none; background: transparent; color: var(--tb-paper); border: 1px solid var(--tb-stone); border-radius: 2px; padding: 7px 12px; font: 13px Arial, sans-serif; cursor: pointer; margin: 0 8px 8px 0; }
  .demo button:hover { border-color: var(--tb-paper); }
  #log { margin: 6px 0 0; padding: 0; list-style: none; font: 12px/1.6 Consolas, "SF Mono", Menlo, monospace; color: rgba(247, 242, 231, 0.8); min-height: 5em; }
  @media (max-width: 520px) { h1 { font-size: 22px; } main { padding: 14px 12px 30px; } }
</style>
</head>
<body>
<main>
  <h1>The sky nobody has looked at</h1>
  <p class="lede">SPHEREx has imaged the whole sky. Almost none of it has been inspected by a person.
    This map is dark wherever nobody using Tombaugh has opened a patch, and lit where somebody has.</p>
  <div id="fog"></div>
  <section class="demo">
    <h2>Demo controls (fake data, nothing is sent anywhere)</h2>
    <button type="button" id="visit">Simulate a visit by someone else</button>
    <button type="button" id="burst">Simulate five visits</button>
    <button type="button" id="reset">Reset the fake counts</button>
    <ul id="log" aria-live="polite"></ul>
  </section>
</main>
<script type="module">
import { createFogMap } from './fogmap.js';
import { ang2pixNest } from './healpix.js';
import { FOG_TARGETS } from './skylines.js';

const params = new URLSearchParams(location.search);

// Deterministic fake counts: clusters of opened cells around the five challenge targets,
// plus a sprinkling of single visits elsewhere.
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function fakeCounts() {
  const counts = new Uint16Array(12288);
  if (params.has('empty')) return counts;
  if (params.has('full')) return counts.fill(3);
  const rand = mulberry32(2026);
  const gauss = () => Math.sqrt(-2 * Math.log(1 - rand())) * Math.cos(2 * Math.PI * rand());
  const bump = (ra, dec, n = 1) => {
    const d = Math.max(-89.9, Math.min(89.9, dec));
    const cell = ang2pixNest(32, ((ra % 360) + 360) % 360, d);
    counts[cell] = Math.min(65535, counts[cell] + n);
  };
  const weight = [520, 260, 380, 300, 240];
  FOG_TARGETS.forEach((t, i) => {
    bump(t.ra, t.dec, 60 + Math.floor(rand() * 140));
    const cosd = Math.cos((t.dec * Math.PI) / 180);
    for (let k = 0; k < weight[i]; k++) {
      const spread = rand() < 0.75 ? 3.2 : 8;
      bump(t.ra + (gauss() * spread) / cosd, t.dec + gauss() * spread, 1);
    }
  });
  for (let k = 0; k < 70; k++) bump(rand() * 360, (Math.asin(2 * rand() - 1) * 180) / Math.PI, 1);
  return counts;
}

let counts = fakeCounts();
const logEl = document.getElementById('log');
const picks = [];
function log(text) {
  const li = document.createElement('li');
  li.textContent = text;
  logEl.prepend(li);
  while (logEl.children.length > 6) logEl.lastChild.remove();
}

const map = createFogMap(document.getElementById('fog'), {
  onPick(pick) {
    picks.push(pick);
    console.log('pick', JSON.stringify(pick));
    log(`onPick  ra ${pick.ra.toFixed(4)}  dec ${pick.dec.toFixed(4)}  cell ${pick.cell}  count ${pick.count}`);
    // What the page shell does: go there, record the visit, refresh the counts.
    map.setHere(pick.ra, pick.dec);
    counts = counts.slice();
    counts[pick.cell] = Math.min(65535, counts[pick.cell] + 1);
    map.setCounts(counts);
  },
});
if (!params.has('wait')) map.setCounts(counts);
if (!params.has('nohere')) map.setHere(269.45, 4.69);

function visit(n) {
  counts = counts.slice();
  for (let k = 0; k < n; k++) {
    const cell = Math.floor(Math.random() * 12288);
    counts[cell] = Math.min(65535, counts[cell] + 1);
    log(`someone opened cell ${cell}`);
  }
  map.setCounts(counts);
}
document.getElementById('visit').addEventListener('click', () => visit(1));
document.getElementById('burst').addEventListener('click', () => visit(5));
document.getElementById('reset').addEventListener('click', () => { counts = fakeCounts(); map.setCounts(counts); });

// For the Playwright check.
window.fogDemo = { map, picks, getCounts: () => counts };
</script>
</body>
</html>
