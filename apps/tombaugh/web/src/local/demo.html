<!doctype html>
<!--
  Tombaugh - SPHEREx blink comparator. Apache-2.0.
  AI-generated code: written by Claude (Anthropic) for team Missing Mass, NASA Space Apps 2026.

  Standalone demo and test page for the in-page data modes (web/src/local/) and the "Data source"
  plugin (web/src/plugins/datasource/). It starts in the practice sky: the proxy's own handler
  runs inside this page, a search and a cutout are answered without any network request, the
  first exposure is decoded and drawn, and the same cutout is asked for a second time to show
  that it comes back from this browser's cache. Every pixel on this page is SIMULATED.

  The page imports ../../../proxy/src/*.js, so serve the REPOSITORY ROOT and open
  /web/src/local/demo.html (or run proxy/dev-server.mjs and open /src/local/demo.html, which
  also gives the "Proxy" choice something to talk to).
    ?source=practice|direct|proxy   start in that source (default here: practice)
    ?ra=150&dec=2.2                 the position to open
    ?w=380                          width of the side column in px
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tombaugh demo: data sources and the practice sky</title>
<style>
  :root { --ink: #171715; --paper: #F7F2E7; --signal: #E53C27; --stone: #77766E; --muted: rgba(247, 242, 231, 0.68); --rule: rgba(247, 242, 231, 0.16); }
  html, body { margin: 0; background: var(--ink); color: var(--paper); font: 13px/1.5 Arial, Helvetica, sans-serif; }
  main { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px 20px 48px; align-items: flex-start; max-width: 1080px; margin: 0 auto; }
  .stage { flex: 1 1 380px; min-width: 0; max-width: 560px; }
  h1 { font: 900 20px/1.2 "Arial Black", Arial, sans-serif; margin: 0 0 4px; }
  h2 { font: bold 11px/1.3 Arial, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
  .lede { color: var(--muted); margin: 0 0 16px; max-width: 60ch; }
  .sky { position: relative; aspect-ratio: 1; background: #0d0d0c; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
  .sky canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  .sky .wait { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 20px; text-align: center; }
  .caption { margin: 8px 0 0; min-height: 1.5em; font-family: Consolas, "Cascadia Mono", Menlo, "DejaVu Sans Mono", monospace; font-size: 12px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0 0; }
  .bar button, .tools button { appearance: none; background: transparent; color: var(--paper); border: 1px solid var(--stone); border-radius: 3px; font: 12px Arial, sans-serif; padding: 6px 10px; min-height: 30px; cursor: pointer; }
  .bar button:hover, .tools button:hover { border-color: var(--paper); }
  .bar button:focus-visible, .tools button:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
  .bar button[disabled] { color: var(--muted); border-color: var(--rule); cursor: not-allowed; }
  .tools button[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .bar .count { color: var(--muted); font-family: Consolas, "Cascadia Mono", Menlo, "DejaVu Sans Mono", monospace; font-size: 12px; }
  .steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .steps li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: baseline; }
  .steps .dot { width: 8px; height: 8px; margin-top: 5px; border: 1px solid var(--stone); border-radius: 50%; }
  .steps li[data-state="ok"] .dot { background: var(--paper); border-color: var(--paper); }
  .steps li[data-state="fail"] .dot { background: var(--signal); border-color: var(--signal); border-radius: 0; }
  .steps li[data-state="run"] .dot { border-color: var(--paper); }
  .steps .what { font-weight: bold; }
  .steps .detail { display: block; color: var(--muted); overflow-wrap: anywhere; }
  .status { margin: 14px 0 0; padding: 8px 10px; border: 1px solid var(--rule); border-left: 3px solid var(--stone); border-radius: 2px; min-height: 1.5em; }
  .status[data-kind="warn"], .status[data-kind="error"] { border-left-color: var(--signal); }
  .status:empty { visibility: hidden; }
  .side { flex: 0 0 auto; width: var(--side-w, 380px); max-width: 100%; background: #1E1E1B; border: 1px solid var(--rule); border-radius: 3px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--rule); }
  .panel { padding: 16px 20px 20px; }
  .panel:focus { outline: none; }
  .panel > h3 { font: 900 14px/1.2 "Arial Black", Arial, sans-serif; margin: 0 0 12px; }
</style>
</head>
<body>
<main>
  <section class="stage" aria-labelledby="title">
    <h1 id="title">Data sources and the practice sky</h1>
    <p class="lede">The proxy's own code runs inside this page. In the practice sky nothing is downloaded: the search, the cutout and the image below are all made here, and all of it is simulated.</p>
    <div class="sky" id="sky">
      <canvas id="canvas" width="472" height="472" aria-label="First exposure of the position, drawn from the decoded frame"></canvas>
      <div class="wait" id="wait">Starting the data service inside this page…</div>
    </div>
    <p class="caption" id="caption"></p>
    <div class="bar">
      <button type="button" id="prev" disabled>Previous exposure</button>
      <button type="button" id="next" disabled>Next exposure</button>
      <span class="count" id="count"></span>
    </div>
    <h2>What happened</h2>
    <ul class="steps" id="steps"></ul>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>
  <aside class="side" aria-label="Side panel of the demo">
    <div class="tools" id="tools"></div>
    <div id="panels"></div>
  </aside>
</main>
<script type="module">
import { createApi, resolveApiBase } from '../api.js';
import { makeWcs } from '../core/wcs.js';
import { formatBytes } from './idbcache.js';
import { createPageApi, parseSourceParam, withSourceParam } from './mode.js';
import { install } from '../plugins/datasource/index.js';

const $ = (id) => document.getElementById(id);
const query = new URLSearchParams(location.search);
const num = (name, fallback) => (query.has(name) && Number.isFinite(Number(query.get(name))) ? Number(query.get(name)) : fallback);
if (query.has('w')) document.documentElement.style.setProperty('--side-w', `${Math.max(280, Math.min(520, num('w', 380)))}px`);

const TARGET = { ra: num('ra', 150), dec: num('dec', 2.2) };
const SIZE = 0.1; // degrees

// ---- the api: the page facade of mode.js. This demo starts in the practice sky unless told otherwise.
const api = createPageApi({
  remote: createApi(resolveApiBase()),
  url: parseSourceParam(location.href) ? location.href : withSourceParam(location.href, 'practice'),
});

// ---- a tiny stand-in for the shell --------------------------------------------------------------
const state = { target: null, search: null, frames: [], movie: [], index: 0, error: null, steps: {}, run: 0 };
const listeners = new Map();
const overlays = new Set();
const emit = (event, payload) => {
  for (const fn of [...(listeners.get(event) || [])]) {
    try {
      fn(payload);
    } catch (err) {
      console.error(err);
    }
  }
};

const app = {
  api,
  target: () => state.target,
  frames: () => state.frames.filter(Boolean),
  movie: () => ({ frames: state.movie }),
  viewer: { element: $('sky') },
  on(event, fn) {
    if (!listeners.has(event)) listeners.set(event, new Set());
    listeners.get(event).add(fn);
    return () => listeners.get(event).delete(fn);
  },
  toast(message, { kind = 'info' } = {}) {
    $('status').textContent = message;
    $('status').dataset.kind = kind;
  },
  addTool({ label, title, onClick }) {
    const el = document.createElement('button');
    el.type = 'button';
    el.textContent = label;
    if (title) el.title = title;
    el.addEventListener('click', () => onClick && onClick());
    $('tools').append(el);
    return { el, setActive: (on) => el.setAttribute('aria-pressed', String(Boolean(on))), remove: () => el.remove() };
  },
  addPanel({ id, title, render }) {
    const section = document.createElement('section');
    section.className = 'panel';
    section.id = `panel-${id}`;
    section.tabIndex = -1;
    const heading = document.createElement('h3');
    heading.textContent = title;
    const body = document.createElement('div');
    section.append(heading, body);
    $('panels').append(section);
    const view = render(body);
    return {
      show: () => section.focus(),
      remove: () => {
        if (view && view.dispose) view.dispose();
        section.remove();
      },
    };
  },
  addOverlay(fn) {
    overlays.add(fn);
    return () => overlays.delete(fn);
  },
  refreshOverlays: () => draw(),
  /** The hook the real shell needs: drop what was loaded and load the current target again. */
  setApi() {
    load();
  },
};

// ---- the readout -------------------------------------------------------------------------------
const STEP_ORDER = ['service', 'search', 'cutout', 'again'];
const STEP_TITLE = { service: 'Data service', search: 'Search', cutout: 'First cutout', again: 'Same cutout again' };
function step(id, stateName, detail) {
  state.steps[id] = { state: stateName, detail };
  $('steps').replaceChildren(
    ...STEP_ORDER.filter((key) => state.steps[key]).map((key) => {
      const li = document.createElement('li');
      li.dataset.state = state.steps[key].state;
      li.dataset.step = key;
      const dot = document.createElement('span');
      dot.className = 'dot';
      const text = document.createElement('span');
      const what = document.createElement('span');
      what.className = 'what';
      what.textContent = STEP_TITLE[key];
      const more = document.createElement('span');
      more.className = 'detail';
      more.textContent = state.steps[key].detail;
      text.append(what, more);
      li.append(dot, text);
      return li;
    }),
  );
}
const ms = (t0) => `${Math.max(1, Math.round(performance.now() - t0))} ms`;

// ---- drawing -----------------------------------------------------------------------------------
function draw() {
  const canvas = $('canvas');
  const ctx = canvas.getContext('2d');
  const frame = state.frames[state.index];
  ctx.fillStyle = '#0d0d0c';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  $('wait').hidden = Boolean(frame);
  if (!frame) return;
  const { nx, ny, image } = frame;
  // A plain robust stretch: 20th percentile to 99.8th, asinh.
  const finite = Array.from(image).filter(Number.isFinite).sort((a, b) => a - b);
  const lo = finite.length ? finite[Math.floor(finite.length * 0.2)] : 0;
  const hi = finite.length ? finite[Math.min(finite.length - 1, Math.floor(finite.length * 0.998))] : 1;
  const span = hi > lo ? hi - lo : 1;
  const small = document.createElement('canvas');
  small.width = nx;
  small.height = ny;
  const pixels = small.getContext('2d').createImageData(nx, ny);
  for (let y = 0; y < ny; y++) {
    for (let x = 0; x < nx; x++) {
      const v = image[y * nx + x];
      const o = ((ny - 1 - y) * nx + x) * 4; // row 0 of a FITS image is the bottom row
      const t = Number.isFinite(v) ? Math.max(0, Math.min(1, Math.asinh((10 * (v - lo)) / span) / Math.asinh(10))) : 0;
      const g = Math.round(255 * t);
      pixels.data[o] = g;
      pixels.data[o + 1] = g;
      pixels.data[o + 2] = g;
      pixels.data[o + 3] = 255;
    }
  }
  small.getContext('2d').putImageData(pixels, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(small, 0, 0, canvas.width, canvas.height);

  // Overlays from plugins (the answer key of the practice sky).
  const movieFrame = state.movie[state.index];
  const wcs = makeWcs(frame.wcs);
  const sx = canvas.width / nx;
  const sy = canvas.height / ny;
  ctx.font = 'bold 12px Arial, Helvetica, sans-serif';
  ctx.textBaseline = 'middle';
  for (const fn of overlays) {
    let extra = null;
    try {
      extra = fn(movieFrame, state.index);
    } catch (err) {
      console.error(err);
    }
    for (const marker of (extra && extra.markers) || []) {
      const [px, py] = wcs.skyToPix(marker.ra, marker.dec);
      if (!Number.isFinite(px) || !Number.isFinite(py)) continue;
      const cx = (px + 0.5) * sx;
      const cy = (ny - 1 - py + 0.5) * sy;
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#171715';
      ctx.beginPath();
      ctx.arc(cx, cy, 16, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#E53C27';
      ctx.stroke();
      if (marker.label) {
        const right = cx + 24 + ctx.measureText(marker.label).width < canvas.width;
        ctx.textAlign = right ? 'left' : 'right';
        const tx = right ? cx + 22 : cx - 22;
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#171715';
        ctx.strokeText(marker.label, tx, cy);
        ctx.fillStyle = '#F7F2E7';
        ctx.fillText(marker.label, tx, cy);
      }
    }
  }
}

function showCaption() {
  const frame = state.frames[state.index];
  const movieFrame = state.movie[state.index];
  const total = state.search ? state.search.frames.length : 0;
  $('count').textContent = total ? `exposure ${state.index + 1} of ${total}` : '';
  $('prev').disabled = !total || state.index <= 0;
  $('next').disabled = !total || state.index >= total - 1;
  if (!frame) {
    $('caption').textContent = '';
    return;
  }
  const parts = [`MJD ${frame.mjd.toFixed(3)}`, `${frame.waveCenter.toFixed(2)} µm`, `${frame.nx} × ${frame.ny} px`];
  if (movieFrame && movieFrame.caption && movieFrame.caption.note) parts.unshift(movieFrame.caption.note);
  $('caption').textContent = parts.join('  ·  ');
}

// ---- loading -----------------------------------------------------------------------------------
async function cacheStats() {
  const cache = await api.dataSource.cache();
  if (!cache || typeof cache.stats !== 'function') return null;
  if (typeof cache.flush === 'function') await cache.flush();
  return cache.stats();
}

async function showFrame(index, run = state.run) {
  const ref = state.search.frames[index];
  if (!state.frames[index]) {
    const frame = await api.cutout(ref.id, TARGET.ra, TARGET.dec, SIZE);
    if (run !== state.run) return null;
    state.frames[index] = frame;
    state.movie[index] = { id: frame.id, mjd: frame.mjd, caption: { note: '' } };
  }
  state.index = index;
  emit('frames', { loaded: app.frames().length });
  emit('movie', app.movie());
  draw();
  showCaption();
  return state.frames[index];
}

async function load() {
  const run = ++state.run;
  Object.assign(state, { target: { ...TARGET }, search: null, frames: [], movie: [], index: 0, error: null, steps: {} });
  $('wait').textContent = 'Starting the data service inside this page…';
  draw();
  showCaption();
  emit('target', state.target);
  const now = api.dataSource.current();
  try {
    let t0 = performance.now();
    step('service', 'run', `${now.label}…`);
    await api.dataSource.apiFor(now.source);
    const cache = await api.dataSource.cache();
    if (cache && cache.ready) await cache.ready();
    if (run !== state.run) return;
    const kind = cache ? cache.stats() : null;
    step('service', 'ok', `${now.label}. ${now.source === 'proxy' ? `Requests go to ${api.baseUrl}.` : `Started in ${ms(t0)}; nothing is sent to a server${now.source === 'direct' ? ' of ours' : ''}.`} Cache: ${kind && kind.persistent ? 'IndexedDB' : 'memory only'}.`);

    t0 = performance.now();
    step('search', 'run', `Which exposures cover RA ${TARGET.ra}, Dec ${TARGET.dec}?`);
    const search = await api.search(TARGET.ra, TARGET.dec);
    if (run !== state.run) return;
    state.search = search;
    const dets = new Set(search.frames.map((f) => f.det));
    step('search', 'ok', `${search.frames.length} exposures on ${dets.size} detectors in ${ms(t0)}${search.simulated ? '. The answer is marked simulated: true.' : '.'}`);
    if (!search.frames.length) {
      $('wait').textContent = 'No exposures cover this position.';
      return;
    }

    const before = await cacheStats();
    t0 = performance.now();
    step('cutout', 'run', 'Asking for the pixels around the position…');
    const frame = await showFrame(0, run);
    if (!frame) return;
    const first = await cacheStats();
    const firstHit = Boolean(before && first && first.hits > before.hits && first.entries === before.entries);
    step('cutout', 'ok', `${frame.nx} × ${frame.ny} pixels at ${frame.waveCenter.toFixed(2)} µm, decoded and drawn in ${ms(t0)}. ${firstHit ? 'It was already in this browser\'s cache from an earlier visit.' : 'It was made just now and stored in the cache.'}`);

    t0 = performance.now();
    step('again', 'run', 'Asking for the same cutout a second time…');
    const again = await api.cutout(frame.id, TARGET.ra, TARGET.dec, SIZE);
    if (run !== state.run) return;
    const second = await cacheStats();
    const hit = Boolean(first && second && second.hits > first.hits && second.entries === first.entries);
    const same = again.image.length === frame.image.length && again.image.every((v, i) => Object.is(v, frame.image[i]));
    step(
      'again',
      hit && same ? 'ok' : 'fail',
      hit
        ? `Served from the cache in ${ms(t0)}${same ? ', identical to the first' : ', but the pixels differ'} (cache hits ${first.hits} → ${second.hits}). The cache holds ${second.entries} ${second.entries === 1 ? 'item' : 'items'}, ${formatBytes(second.bytes)}, ${second.persistent ? 'in IndexedDB' : 'in memory only'}.`
        : 'This request was not answered from the cache.',
    );
    window.__demo.result = { source: now.source, simulated: Boolean(search.simulated), frames: search.frames.length, nx: frame.nx, ny: frame.ny, firstHit, secondHit: hit, same, cache: second };
  } catch (err) {
    if (run !== state.run) return;
    state.error = err;
    const failed = STEP_ORDER.find((key) => state.steps[key] && state.steps[key].state === 'run') || 'service';
    step(failed, 'fail', err && err.message ? err.message : String(err));
    $('wait').textContent = 'Nothing to show: see below.';
    window.__demo.result = { source: now.source, error: err && err.message ? err.message : String(err) };
  }
}

$('prev').addEventListener('click', () => showFrame(state.index - 1).catch((err) => app.toast(err.message, { kind: 'error' })));
$('next').addEventListener('click', () => showFrame(state.index + 1).catch((err) => app.toast(err.message, { kind: 'error' })));

window.__demo = { app, api, state, result: null, plugin: null };
window.__demo.plugin = install(app);
load();
</script>
</body>
</html>
