<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050818">
<title>Afterloop</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#050818;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
[hidden]{display:none!important}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.ui{position:fixed;inset:0;pointer-events:none}
button{pointer-events:auto;font:inherit;color:#fff;background:rgba(16,24,66,.9);border:1.5px solid rgba(170,190,255,.45);border-radius:999px;cursor:pointer;touch-action:manipulation}
button:focus{outline:none}
button:focus-visible{outline:3px solid #7ff;outline-offset:3px}
button:active{transform:scale(.96)}
#top{position:absolute;left:0;right:0;top:0;height:52px;padding:env(safe-area-inset-top) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between}
.ib{width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(16,24,66,.55)}
.ib svg{width:22px;height:22px;fill:#cfd6ff}
#best{font-size:13px;letter-spacing:.14em;color:#cfd6ff;font-variant-numeric:tabular-nums}
#hud{position:absolute;width:0;height:0}
#hud>div,#cnum{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;text-align:center}
#lap{font-size:13px;letter-spacing:.2em;opacity:.7}
#score{font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#mult{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:rgba(127,255,255,.14);color:#bff}
#hud>#prompt{transform:translate(-50%,0);white-space:pre-line;font-size:13px;font-weight:600;color:#cfd6ff;line-height:1.3}
#cnum{font-size:clamp(48px,18vmin,120px);font-weight:900}
.ov{position:absolute;left:0;right:0;top:calc(52px + env(safe-area-inset-top));bottom:calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;padding:0 10px}
.card{background:rgba(7,11,36,.84);border:1px solid rgba(170,190,255,.22);border-radius:22px;padding:clamp(10px,3.4vmin,26px) clamp(14px,5vmin,34px);text-align:center;max-width:420px;max-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1.5vmin,12px)}
.card p{margin:0}
.word{margin:0;font-size:clamp(26px,10vmin,60px);font-weight:900;letter-spacing:.12em;text-indent:.12em;background:linear-gradient(90deg,#7ff,#fff 50%,#c07bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:clamp(12px,3.6vmin,17px);color:#cfd6ff}
.pill{min-height:clamp(46px,12vmin,60px);padding:0 34px;font-size:clamp(17px,4.6vmin,22px);font-weight:800;background:linear-gradient(180deg,#8ff,#4fd8ff);color:#04122a;border:0}
.hint,.small{font-size:13px;color:#cfd6ff}
.small b{color:#fff;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:7px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(207,214,255,.5);box-sizing:border-box}
.dots i.on{background:#ffd54a;border-color:#ffd54a}
.sm{min-height:40px;padding:0 16px;font-size:13px;color:#cfd6ff}
h2{margin:0;font-size:clamp(24px,8vmin,40px);letter-spacing:.08em}
.lbl{font-size:12px;letter-spacing:.2em;color:#cfd6ff}
.big{font-size:clamp(40px,15vmin,84px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.ribbon{background:#ffd54a;color:#1a1300;font-weight:800;font-size:13px;padding:4px 14px;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,2.4vmin,18px)}
.stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:#cfd6ff}
#again{min-height:56px;width:100%}
#toast{position:absolute;top:calc(58px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#ffd54a;color:#1a1300;font-weight:800;font-size:14px;padding:8px 16px;border-radius:999px;white-space:nowrap;z-index:2}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-height:360px){.hint{display:none}.card{gap:3px}}
</style>
</head>
<body>
<canvas id="cv" role="img" aria-label="Afterloop game field: an orb circles a glowing ring while ghosts of its past laps fly the other way"></canvas>
<div id="safe"></div>
<div class="ui">
  <div id="top">
    <button id="pb" class="ib" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
    <div id="best">BEST 0</div>
    <button id="mb" class="ib" aria-label="Mute sound" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="won" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#cfd6ff" stroke-width="2" stroke-linecap="round"/><path id="woff" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="#cfd6ff" stroke-width="2" stroke-linecap="round" hidden/></svg></button>
  </div>
  <div id="hud" hidden><div id="lap">LAP 1</div><div id="score">0</div><div id="mult">x1</div><div id="prompt"></div></div>
  <div id="cnum" aria-live="assertive" hidden>3</div>
  <div id="title" class="ov"><div class="card">
    <h1 class="word">AFTERLOOP</h1>
    <p class="tag">Every lap you fly comes back as a ghost.</p>
    <button id="play" class="pill">Tap to fly</button>
    <p class="hint" id="hint" hidden>Hold Space or click</p>
    <p class="small">Best <b id="tBest">0</b></p>
    <div class="dots" id="dots" role="img" aria-label="0 of 8 badges"></div>
    <button id="motion" class="sm">Motion: Auto</button>
  </div></div>
  <div id="pause" class="ov" hidden><div class="card">
    <h2>Paused</h2><p class="tag">Tap to resume</p><p class="small" id="pinfo"></p>
  </div></div>
  <div id="over" class="ov" hidden><div class="card">
    <div class="ribbon" id="nb" hidden>New best!</div>
    <p class="lbl">SCORE</p><div class="big" id="oScore">0</div>
    <p class="small">Best <b id="oBest">0</b></p>
    <div class="stats"><div><b id="sL">0</b><span>Laps</span></div><div><b id="sM">x1</b><span>Best mult</span></div><div><b id="sG">0</b><span>Grazes</span></div><div><b id="sS">0</b><span>Sparks</span></div></div>
    <button id="again" class="pill">Fly again</button>
  </div></div>
  <div id="toast" role="status" hidden></div>
  <div id="live" class="sr" aria-live="polite"></div>
</div>
<script>
// Afterloop simulation. Pure logic, no DOM, so it can be tested headlessly.
var CONFIG = {
R0: 0.5, RW: 0.42, ro: 0.42 / 18,
acc: 10, vMax: 2.4, squashV: 1, squashT: 0.12,
lapT0: 6.5, lapK: 0.975, lapTMin: 3.6,
gBase: 0.5, gFrom: 20, gStep: 0.015, gMax: 0.8,
capAt: [2, 6, 10, 15, 21],
slots: 720, slotDeg: 0.5, sub: 1 / 240, maxSub: 24, maxFrame: 0.1,
fadeT: 0.5, dissolveT: 0.4,
hitK: 1.6, grazeK: 3.4, grazeGap: 20, sparkK: 2.2,
spawnMin: 120, spawnMax: 330, spawnStep: 5, spawnSafe: 0.8,
sparkDMin: 150, sparkDMax: 330, sparkUMin: 0.1, sparkUMax: 0.9, sparkCap: 3, sparkPerLap: 2,
lapPts: 10, sparkPts: 5, multMax: 8, markT: 1.5, markA: 0.9,
colors: ['#6ef2c0', '#4fd8ff', '#5b9dff', '#8d7bff', '#c07bff'],
notes: [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51],
particles: 160, shards: 40, reducedParticles: 0.3,
hitStop: 0.12, slowT: 0.6, slowK: 0.25, shakePx: 8, reducedFreeze: 0.25,
countStep: 0.5, restartLock: 500, saveWait: 2500, popT: 0.7, popRise: 24,
toastT: 1800, promptT: 2.5, tail: 24, pulseT: 0.5, volume: 0.5
};
var AL = (function (C) {
var RAD = Math.PI / 180, N = C.slots, SD = C.slotDeg;
function mod(a, m) { a %= m; return a < 0 ? a + m : a; }
function gap(a, b) { var d = mod(a - b, 360); return d > 180 ? 360 - d : d; }
function R(u) { return C.R0 + C.RW * u; }
function look(rec, phi) {
 var x = mod(phi, 360) / SD, i = Math.floor(x), f = x - i, a = rec[i % N], b = rec[(i + 1) % N];
 return a + (b - a) * f;
}
function dist(t1, u1, t2, u2) {
 var r1 = R(u1), r2 = R(u2), q = r1 * r1 + r2 * r2 - 2 * r1 * r2 * Math.cos((t1 - t2) * RAD);
 return Math.sqrt(q > 0 ? q : 0);
}
function lapT(L) { return Math.max(C.lapTMin, C.lapT0 * Math.pow(C.lapK, L - 1)); }
function gFor(L) { return L <= C.gFrom ? C.gBase : Math.min(C.gMax, C.gBase + C.gStep * (L - C.gFrom)); }
function capFor(L) { var c = 0; for (var i = 0; i < C.capAt.length; i++) if (L >= C.capAt[i]) c = i + 1; return c; }
function newRec() { var r = new Float32Array(N); r.fill(NaN); return r; }

// o: {noHit, u, rnd, cap, g, T} (the last three are test overrides)
function makeSim(o) {
 o = o || {};
 var rnd = o.rnd || Math.random;
 var s = {
  theta: 0, u: o.u == null ? 1 : o.u, v: 0, L: 1, w: 0, g: 0, held: false, alive: true, noHit: !!o.noHit,
  ghosts: [], sparks: [], score: 0, mult: 1, bestMult: 1, grazes: 0, lapGrazes: 0, sparksGot: 0,
  lapGhosts: 0, ev: [], gid: 0, rec: newRec(), nxt: newRec()
 };
 s.rec[0] = s.u;
 function speeds() { s.w = 360 / (o.T || lapT(s.L)); s.g = o.g != null ? o.g : gFor(s.L); }
 speeds();
 function closing() { return s.w * (1 + s.g); }

 s.spawn = function (rec) {
  // Earliest meeting must stay 0.8 s away even at top speed, so the nearest candidate grows with speed.
  var hitDeg = C.hitK * C.ro / C.R0 / RAD, st = C.spawnStep;
  var dMin = Math.max(C.spawnMin, Math.ceil((C.spawnSafe * closing() + hitDeg) / st) * st);
  var best = -1, cands = [], d, i, a, m, gh;
  for (d = dMin; d <= C.spawnMax; d += st) {
   a = mod(s.theta + d, 360); m = 999;
   for (i = 0; i < s.ghosts.length; i++) if (s.ghosts[i].st !== 2) m = Math.min(m, gap(a, s.ghosts[i].a));
   if (m > best + 1e-6) { best = m; cands = [a]; } else if (m > best - 1e-6) cands.push(a);
  }
  if (!cands.length) cands.push(mod(s.theta + C.spawnMax, 360));
  gh = { id: ++s.gid, rec: rec, a: cands[Math.floor(rnd() * cands.length) % cands.length], st: 0, age: 0, win: false, minD: 9 };
  s.ghosts.push(gh);
  s.ev.push({ t: 'spawn', id: gh.id, a: gh.a, th: s.theta });
  return gh;
 };

 function graze(gh) {
  var pts = s.mult;
  s.score += pts; s.grazes++; s.lapGrazes++;
  s.ev.push({ t: 'graze', id: gh.id, pts: pts });
  if (s.mult < C.multMax) {
   s.mult++;
   if (s.mult > s.bestMult) s.bestMult = s.mult;
   s.ev.push({ t: 'mult', m: s.mult, up: true });
  }
 }

 function seam() {
  var lap = s.L, pts = C.lapPts * s.mult, k, live, cap, done;
  s.score += pts;
  s.ev.push({ t: 'lap', lap: lap, pts: pts, ghosts: s.lapGhosts });
  if (!s.lapGrazes && lap >= 2 && s.mult > 1) { s.mult--; s.ev.push({ t: 'mult', m: s.mult, up: false }); }
  s.L++; speeds();
  done = s.rec; s.rec = s.nxt; s.nxt = newRec();
  cap = o.cap || capFor(s.L);
  live = s.ghosts.filter(function (g) { return g.st !== 2; });
  while (live.length && live.length + 1 > cap) {
   var old = live.shift();
   old.st = 2; old.age = 0; old.win = false;
   s.ev.push({ t: 'dissolve', id: old.id });
  }
  if (cap > 0) { s.spawn(done); live.push(0); }
  s.lapGhosts = live.length;
  s.sparks = s.sparks.filter(function (p) { return p.lap >= s.L - 1; });
  for (k = 0; k < C.sparkPerLap && s.sparks.length < C.sparkCap; k++) {
   s.sparks.push({
    a: mod(s.theta + C.sparkDMin + rnd() * (C.sparkDMax - C.sparkDMin), 360),
    u: C.sparkUMin + rnd() * (C.sparkUMax - C.sparkUMin), lap: s.L
   });
  }
  s.lapGrazes = 0;
 }

 function step(h) {
  var i, gh;
  if (s.alive) {
   var pu = s.u, pt = s.theta, imp;
   s.v += (s.held ? -C.acc : C.acc) * h;
   if (s.v > C.vMax) s.v = C.vMax; else if (s.v < -C.vMax) s.v = -C.vMax;
   s.u += s.v * h;
   if (s.u < 0 || s.u > 1) {
    imp = Math.abs(s.v); s.u = s.u < 0 ? 0 : 1; s.v = 0;
    if (imp > C.squashV) s.ev.push({ t: 'wall' });
   }
   s.theta += s.w * h;
   // Write every slot crossed this substep, interpolated, so no frame rate leaves gaps.
   var i1 = Math.floor(s.theta / SD), span = s.theta - pt;
   for (i = Math.floor(pt / SD) + 1; i <= i1; i++) {
    var val = pu + (s.u - pu) * ((i * SD - pt) / span);
    if (i < N) s.rec[i] = val; else s.nxt[i - N] = val;
   }
  }
  var dg = s.g * s.w * h, hitR = C.hitK * C.ro, grR = C.grazeK * C.ro;
  for (i = s.ghosts.length - 1; i >= 0; i--) {
   gh = s.ghosts[i];
   gh.a = mod(gh.a - dg, 360); gh.age += h;
   if (gh.st === 0 && gh.age >= C.fadeT) gh.st = 1;
   else if (gh.st === 2 && gh.age >= C.dissolveT) { s.ghosts.splice(i, 1); continue; }
   if (gh.st !== 1 || !s.alive) continue;
   var d = dist(s.theta, s.u, gh.a, look(gh.rec, gh.a));
   if (d < hitR && !s.noHit) { s.alive = false; s.ev.push({ t: 'hit', id: gh.id }); break; }
   if (gap(s.theta, gh.a) < C.grazeGap) { if (!gh.win || d < gh.minD) gh.minD = d; gh.win = true; }
   else if (gh.win) { gh.win = false; if (gh.minD < grR) graze(gh); }
  }
  if (!s.alive) return;
  for (i = s.sparks.length - 1; i >= 0; i--) {
   var p = s.sparks[i];
   if (dist(s.theta, s.u, p.a, p.u) < C.sparkK * C.ro) {
    var sp = C.sparkPts * s.mult;
    s.score += sp; s.sparksGot++; s.sparks.splice(i, 1);
    s.ev.push({ t: 'spark', a: p.a, u: p.u, pts: sp });
   }
  }
  if (s.theta >= 360) { s.theta -= 360; seam(); }
 }

 s.update = function (dt) {
  if (!(dt > 0)) return;
  if (dt > C.maxFrame) dt = C.maxFrame;
  var n = Math.min(C.maxSub, Math.max(1, Math.ceil(dt / C.sub - 1e-6))), h = dt / n;
  for (var k = 0; k < n; k++) step(h);
 };

 // Upcoming meetings with solid ghosts: time, angle and the ghost's band position there.
 s.meets = function (out) {
  out.length = 0;
  var cl = closing();
  for (var i = 0; i < s.ghosts.length; i++) {
   var gh = s.ghosts[i];
   if (gh.st !== 1) continue;
   var tm = mod(gh.a - s.theta, 360) / cl;
   if (tm < C.markT) {
    var phi = mod(s.theta + s.w * tm, 360);
    out.push({ id: gh.id, t: tm, a: phi, u: look(gh.rec, phi) });
   }
  }
  return out;
 };
 return s;
}
return { makeSim: makeSim, look: look, dist: dist, gap: gap, mod: mod, lapT: lapT, gFor: gFor, capFor: capFor };
})(CONFIG);
</script>
<script>
(function () {
'use strict';
var C = CONFIG, RAD = Math.PI / 180, TAU = Math.PI * 2, FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
function $(id) { return document.getElementById(id); }
var cv = $('cv'), ctx = cv.getContext('2d'), bg = document.createElement('canvas'), bx = bg.getContext('2d');
var W = 0, H = 0, DPR = 1, S = 100, CX = 0, CY = 0, PX = 0, PY = 0;
var TITLE = 0, PLAY = 1, PAUSE = 2, COUNT = 3, DYING = 4, OVER = 5, state = TITLE;
var SLUGS = ['first-loop', 'past-dodger', 'ten-laps', 'full-echo', 'close-shave', 'max-multiplier', 'spark-hoarder', 'score-1000'];
var NAMES = ['First Loop', 'Past Dodger', 'Ten Laps', 'Full Echo', 'Close Shave', 'Max Multiplier', 'Spark Hoarder', 'Score 1000'];
var NUMS = ['best', 'bestLaps', 'bestMult', 'runs', 'totalLaps', 'totalSparks', 'totalGrazes'];
var MOTIONS = ['auto', 'reduced', 'full'], MLABEL = { auto: 'Auto', reduced: 'Reduced', full: 'Full' };
var save = { best: 0, bestLaps: 0, bestMult: 1, runs: 0, totalLaps: 0, totalSparks: 0, totalGrazes: 0, got: [], settings: { muted: false, motion: 'auto' } };
// hostClaimed: the play page said a cloud read is coming. loaded: a restore arrived. sentEarly: a save left before it.
var saveReady = false, savePending = false, touched = false, knownBest = 0, hostClaimed = false, loaded = false, sentEarly = false, early = [];
var sim = AL.makeSim({ noHit: true, u: 0.5 }), botT = 0;
var pointers = new Set(), keys = new Set(), armed = true, overAt = 0;
var raf = 0, last = 0, countT = 0, countN = 0, dieT = 0, shakeT = 0, pulseT = 9, squashT = 0, promptT = 0, tailAcc = 0, promptHi = 0, promptLo = 0;
var tail = [], pops = [], meets = [], parts = [], shown = {}, toastQ = [], toastOn = false;
for (var i0 = 0; i0 < C.particles; i0++) parts.push({ on: false });
var mq = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
var fine = !!(window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches);
function reduced() { var m = save.settings.motion; return m === 'reduced' || (m === 'auto' && !!(mq && mq.matches)); }
function held() { return pointers.size > 0 || keys.size > 0; }

// ---------- bridge (every window.batchly use is looked up at call time and guarded) ----------
function submit(score) {
 if (!(score > 0)) return;
 if (window.batchly && window.batchly.submitScore) { window.batchly.submitScore(score); }
}
// Ctrl+S: the bridge calls onSave, then posts batchly-saved. The play page only confirms an
// account save when that ack arrives first, so the payload waits one task.
function onSaveHook() { setTimeout(saveNow, 0); }
function hookBridge() {
 try { if (window.batchly && window.batchly.onSave !== onSaveHook) window.batchly.onSave = onSaveHook; } catch (e) {}
}
function saveNow() {
 if (!saveReady) { savePending = true; return; }
 var st = save.settings, obj = {
  v: 1, best: save.best, bestLaps: save.bestLaps, bestMult: save.bestMult, runs: save.runs,
  totalLaps: save.totalLaps, totalSparks: save.totalSparks, totalGrazes: save.totalGrazes,
  got: save.got.slice(), settings: { muted: st.muted, motion: st.motion }
 };
 try { if (window.batchly && window.batchly.saveGame) { window.batchly.saveGame(obj); if (!loaded) sentEarly = true; } } catch (e) {}
}
function markReady() {
 if (saveReady) return;
 saveReady = true; hookBridge();
 early.splice(0).forEach(announce); // merge already dropped the ones the profile owned
 if (savePending) { savePending = false; saveNow(); }
}
// On the first restore lifetime counters are added (a max loses pre-restore play); records (NUMS 0-2) keep the max.
function merge(d, first) {
 if (!d || typeof d !== 'object' || d.v !== 1) return false;
 NUMS.forEach(function (k, i) {
  var n = Number(d[k]);
  if (!Number.isFinite(n) || n <= 0) return;
  n = Math.floor(n);
  if (first && i > 2) save[k] += n; else if (n > save[k]) save[k] = n;
 });
 var own = Array.isArray(d.got) ? d.got : [];
 own.forEach(function (g) { if (SLUGS.indexOf(g) >= 0 && save.got.indexOf(g) < 0) save.got.push(g); });
 early = early.filter(function (g) { return own.indexOf(g) < 0; });
 var st = d.settings;
 if (st && typeof st === 'object' && !touched) {
  if (typeof st.muted === 'boolean') save.settings.muted = st.muted;
  if (MOTIONS.indexOf(st.motion) >= 0) save.settings.motion = st.motion;
 }
 knownBest = Math.max(knownBest, save.best);
 if (state === OVER && Number(d.best) >= sim.score) $('nb').hidden = true; // the run did not beat the real best
 applySettings(); refreshTitle();
 return true;
}
window.addEventListener('message', function (e) {
 var m = e && e.data;
 if (!m || typeof m !== 'object') return;
 // The play page claims the load before a read that can outlast 2.5 s; saving on the timer would upsert zeros.
 if (m.type === 'batchly-save-host') { hostClaimed = true; return; }
 if (m.type !== 'batchly-savedata') return;

  else if (dieT < C.hitStop) fx = 0;
  else {
   fx = dt * C.slowK; shakeT = Math.max(0, shakeT - dt);
   sim.update(fx); drain(false);
   if (dieT >= C.hitStop + C.slowT) over();
  }
 } else if (state === OVER) { fx = dt * C.slowK; sim.update(fx); drain(false); }
 // 60 Hz by time so the trail spans 0.4 s at any refresh rate; the slack stops 60 Hz jitter doubling samples.
 if (state === PLAY || state === TITLE) {
  tailAcc += dt;
  while (tailAcc > 0.015) { tailAcc -= 1 / 60; tail.push([sim.theta, sim.u]); if (tail.length > C.tail) tail.shift(); }
 }
 for (var i = 0; i < parts.length; i++) {
  var p = parts[i];
  if (!p.on) continue;
  p.life += fx;
  if (p.life >= p.max) { p.on = false; continue; }
  var dr = Math.max(0, 1 - 2.2 * fx);
  p.x += p.vx * fx; p.y += p.vy * fx; p.vx *= dr; p.vy *= dr; p.rot += p.vr * fx;
 }
 for (i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t >= C.popT) pops.splice(i, 1); }
 squashT -= dt; pulseT += dt; if (state === PLAY) promptT -= dt;
 hud(); draw();
 if (state !== PAUSE) raf = requestAnimationFrame(frame);
}

// ---------- input ----------
function press() {
 unlockAudio();
 if (state === TITLE) startRun();
 else if (state === PAUSE) { if (armed) resume(); }
 else if (state === OVER) { if (armed && performance.now() - overAt >= C.restartLock) startRun(); }
}
function release() { if (!held()) armed = true; }
cv.addEventListener('pointerdown', function (e) {
 if (e.pointerType === 'mouse' && e.button !== 0) return;
 e.preventDefault();
 try { cv.setPointerCapture(e.pointerId); } catch (x) {}
 var fresh = !held();
 pointers.add(e.pointerId);
 if (fresh || state !== PAUSE) press();
});
// A touch pointerdown is not a user activation; pointerup and touchend are, so audio unlocks there too.
function up(e) { unlockAudio(); if (pointers.delete(e.pointerId)) release(); }
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('lostpointercapture', up);
window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
function onBtn(e) { return !!(e.target && e.target.closest && e.target.closest('button')); }
document.addEventListener('touchstart', function (e) { if (!onBtn(e)) e.preventDefault(); }, { passive: false });
document.addEventListener('touchend', unlockAudio, { passive: true });
document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
var DIVE = { Space: 1, ArrowUp: 1, ArrowDown: 1, KeyW: 1, KeyZ: 1, Enter: 1, NumpadEnter: 1 };
function code(e) {
 if (e.code) return e.code;
 var k = e.key || '';
 return k === ' ' || k === 'Spacebar' ? 'Space' : k === 'Esc' ? 'Escape' : /^[a-z]$/i.test(k) ? 'Key' + k.toUpperCase() : k;
}
window.addEventListener('keydown', function (e) {
 if (e.ctrlKey || e.metaKey || e.altKey) return;
 var k = code(e), activate = k === 'Space' || k === 'Enter' || k === 'NumpadEnter';
 if (DIVE[k]) {
  if (activate && e.target && e.target.tagName === 'BUTTON') return; // a focused button handles its own key
  e.preventDefault();
  if (e.repeat || keys.has(k)) return;
  keys.add(k); unlockAudio();
  if (state === PLAY || state === COUNT) return;
  if (state === PAUSE || activate) press();
  return;
 }
 if (e.repeat) return;
 if (k === 'KeyP' || k === 'Escape') { e.preventDefault(); togglePause(); }
 else if (k === 'KeyM') toggleMute();
});
window.addEventListener('keyup', function (e) {
 var k = code(e);
 if (DIVE[k] && keys.delete(k)) { e.preventDefault(); release(); }
});
function clearInput() { pointers.clear(); keys.clear(); armed = true; }
// Scores go out at game over, or here if the tab is left mid-run, so play-page banners land while paused.
function autoPause() {
 clearInput();
 if (state !== TITLE && sim.score > knownBest) { knownBest = sim.score; submit(sim.score); }
 if (state === PLAY || state === COUNT) pause();
}
window.addEventListener('blur', autoPause);
window.addEventListener('pagehide', autoPause);
document.addEventListener('visibilitychange', function () { if (document.hidden) autoPause(); });
function toggleMute() {
 save.settings.muted = !save.settings.muted; touched = true;
 unlockAudio(); applySettings(); saveNow();
}
function btn(id, fn) {
 var b = $(id);
 b.addEventListener('pointerdown', function (e) { e.stopPropagation(); e.preventDefault(); });
 b.addEventListener('click', function (e) { e.stopPropagation(); unlockAudio(); fn(); });
}
btn('pb', togglePause);
btn('mb', toggleMute);
btn('motion', function () {
 var m = save.settings.motion;
 save.settings.motion = MOTIONS[(MOTIONS.indexOf(m) + 1) % MOTIONS.length]; touched = true;
 applySettings(); saveNow();
});
btn('play', function () { if (state === TITLE) startRun(); });
btn('again', function () { if (state === OVER && performance.now() - overAt >= C.restartLock) startRun(); });

// ---------- boot ----------
$('hint').hidden = !fine;
window.addEventListener('resize', layout);
if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
window.addEventListener('orientationchange', function () { setTimeout(layout, 150); });
// The bridge script is injected after this one, so hook onSave again once the document has parsed.
hookBridge();
document.addEventListener('DOMContentLoaded', hookBridge);
window.addEventListener('load', hookBridge);
// Standalone and preview surfaces never claim the load, so they open saves after 2.5 s.
setTimeout(function () { if (!hostClaimed) markReady(); }, C.saveWait);
applySettings(); refreshTitle(); show(); layout(); loop();
})();
</script>
</body>
</html>
