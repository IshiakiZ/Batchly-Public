<meta name="color-scheme" content="dark" />
<meta name="description" content="Word Ladder: turn a start word into a target by changing one letter at a time. Every step must be a real word. Hints, undo, and solvable-by-construction puzzles at three difficulties." />
<title>WORD LADDER</title>
<!--
  WORD LADDER: original word puzzle for Batchly.
  ==========================================================================
  DESIGN NOTES

  The puzzle
    Turn a START word into a TARGET word by changing exactly ONE letter per
    step. Every intermediate word must exist in the embedded dictionary. Reach
    the target to win. Classic Lewis-Carroll "doublets", built fresh each round.

  Dictionary + graph (correctness by construction)
    ~700 common 4-letter English words are embedded inline (no network). At
    load we build an adjacency list: two words are neighbours iff they differ
    in exactly one position. That graph drives everything: generation, hints,
    and win detection all read the SAME graph, so what the generator promises
    is always what the player can do.

  Puzzles are solvable, never impossible
    A puzzle is generated by breadth-first search from a random start word:
    BFS gives the exact shortest distance to every reachable word. We pick a
    target whose distance falls in the difficulty band, so PAR is the true
    minimum step count and a solution is guaranteed to exist. If a start's
    component is too small for the band we simply try another start; a hard
    fixed fallback (COLD->WARM) guarantees termination.

  Hints are legal, optimal, and always available
    HINT runs BFS from the CURRENT word to the target and fills in the next
    word on a shortest path. Because every legal move stays inside the target's
    connected component, the target is reachable from any position you can
    reach, so a hint can never dead-end.

  Move validation (the only thing that can be committed is a legal word)
    A submission is accepted only if it (a) differs from the current word in
    exactly one position and (b) is in the dictionary. Anything else is
    refused with a specific reason. Illegal words can never enter the ladder.

  Input
    Play with the physical keyboard (type letters, Backspace, arrows, Enter),
    the on-screen keyboard (touch/mouse), or by tapping tiles. Tap any earlier
    rung to rewind the ladder to that point. Nothing traps focus.

  Leaderboard contract
    has_leaderboard = FALSE for this game. It therefore posts NO score message
    of any kind, ever. (There is no window.parent.postMessage score call in
    this file; search for it and you will not find one.)
  ==========================================================================
-->
<style>
  :root{
    --bg:#10100e;
    --panel:#18181d;
    --panel2:#1f1f26;
    --bone:#f5f2e8;
    --red:#ef3a3a;
    --line:#2a2a30;
    --dim:#6a6a72;
    --dim2:#9a9aa2;
    --green:#4ecb6e;
    --amber:#e8b53a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);}
  body{
    color:var(--bone);
    font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  #app{
    height:100%;
    display:flex;
    flex-direction:column;
    max-width:640px;
    margin:0 auto;
    padding:8px 10px 10px;
  }

  /* ---- header ---- */
  header{flex:0 0 auto;text-align:center;padding:2px 0 6px;}
  .title{
    font-size:clamp(20px,6.2vw,30px);
    font-weight:800;letter-spacing:3px;line-height:1;
  }
  .title b{color:var(--red);}
  .sub{
    margin-top:5px;
    font-size:clamp(9px,2.5vw,11px);
    color:var(--dim2);letter-spacing:.3px;
  }

  /* ---- top bar (goal + stats + difficulty) ---- */
  #topbar{
    flex:0 0 auto;
    display:flex;flex-wrap:wrap;gap:6px;
    align-items:stretch;justify-content:space-between;
    margin-bottom:6px;
  }
  .goalcard{
    flex:1 1 auto;min-width:180px;
    background:var(--panel);border:2px solid var(--line);
    padding:6px 8px;
    display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
    font-size:clamp(11px,3vw,14px);letter-spacing:1px;
  }
  .goalcard .lab{color:var(--dim);font-size:.7em;letter-spacing:1px;}
  .goalcard .w{color:var(--bone);font-weight:800;}
  .goalcard .w.t{color:var(--red);}
  .goalcard .arrow{color:var(--dim2);}
  .stats{
    flex:0 0 auto;display:flex;gap:6px;
  }
  .stat{
    background:var(--panel);border:2px solid var(--line);
    padding:5px 8px;min-width:52px;text-align:center;
  }
  .stat .k{display:block;font-size:9px;color:var(--dim);letter-spacing:1px;}
  .stat .v{display:block;font-size:clamp(14px,4vw,18px);font-weight:800;line-height:1.1;}
  .stat .v.over{color:var(--amber);}
  .stat .v.good{color:var(--green);}

  .diffrow{
    flex:1 1 100%;
    display:flex;gap:6px;
  }
  .diffrow .grp{display:flex;gap:0;flex:1 1 auto;border:2px solid var(--line);}
  .diffbtn{
    flex:1 1 0;
    background:var(--panel);color:var(--dim2);
    border:0;border-right:2px solid var(--line);
    padding:6px 4px;
    font-family:inherit;font-size:clamp(9px,2.6vw,11px);font-weight:700;letter-spacing:1px;
    cursor:pointer;touch-action:manipulation;
  }
  .diffbtn:last-child{border-right:0;}
  .diffbtn.active{background:var(--red);color:#fff;}
  .newbtn{
    flex:0 0 auto;
    background:var(--panel);color:var(--bone);
    border:2px solid var(--bone);
    padding:6px 12px;
    font-family:inherit;font-size:clamp(9px,2.6vw,11px);font-weight:800;letter-spacing:1px;
    cursor:pointer;touch-action:manipulation;
    box-shadow:3px 3px 0 0 var(--red);
  }
  .newbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 0 var(--red);}

  /* ---- ladder ---- */
  #ladder{
    flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    background:var(--panel);border:2px solid var(--line);
    padding:8px 6px;
    display:flex;flex-direction:column;gap:5px;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }
  #ladder::-webkit-scrollbar{width:8px;}
  #ladder::-webkit-scrollbar-thumb{background:var(--line);}
  .rung{
    display:flex;align-items:center;gap:8px;
  }
  .rung .num{
    flex:0 0 auto;width:20px;text-align:right;
    font-size:11px;color:var(--dim);
  }
  .rung .tiles{display:flex;gap:5px;}
  .rung.click{cursor:pointer;}
  .rung.click:hover .tiles{opacity:.75;}
  .rung .badge{
    flex:0 0 auto;font-size:9px;letter-spacing:1px;color:var(--dim);
    border:1px solid var(--line);padding:1px 4px;
  }
  .rung .badge.start{color:var(--dim2);border-color:var(--dim);}
  .rung .badge.win{color:var(--green);border-color:var(--green);}
  .rung.goal{opacity:.5;}
  .rung.goal .badge{color:var(--red);border-color:var(--red);}
  .rung.goal.reached{opacity:1;}

  .tile{
    width:clamp(30px,8.6vw,44px);
    height:clamp(34px,9.6vw,50px);
    border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(16px,5vw,24px);font-weight:800;line-height:1;
    background:var(--panel2);color:var(--bone);
    text-transform:uppercase;
  }
  .tile.chg{color:var(--red);border-color:var(--red);}
  .tile.ghost{background:transparent;border-style:dashed;color:var(--dim2);}

  /* ---- step label + input ---- */
  #stepLabel{
    flex:0 0 auto;text-align:center;
    font-size:clamp(9px,2.6vw,11px);color:var(--dim2);letter-spacing:.5px;
    margin:7px 0 4px;
  }
  #stepLabel b{color:var(--bone);}
  #inputRow{
    flex:0 0 auto;
    display:flex;align-items:stretch;justify-content:center;gap:6px;
    margin-bottom:4px;
  }
  .itile{
    width:clamp(34px,9.6vw,50px);
    height:clamp(38px,10.6vw,56px);
    border:2px solid var(--bone);
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(18px,5.6vw,28px);font-weight:800;
    background:var(--panel2);color:var(--bone);cursor:pointer;
    touch-action:manipulation;position:relative;
  }
  .itile.cursor{border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red);}
  .itile.cursor::after{
    content:'';position:absolute;bottom:4px;left:22%;right:22%;height:2px;background:var(--red);
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  .itile.diff{color:var(--red);}
  .itile.over{color:var(--amber);border-color:var(--amber);}
  .enterbtn{
    flex:0 0 auto;
    background:var(--red);color:#fff;border:2px solid var(--red);
    padding:0 12px;
    font-family:inherit;font-size:clamp(11px,3vw,14px);font-weight:800;letter-spacing:1px;
    cursor:pointer;touch-action:manipulation;
    box-shadow:3px 3px 0 0 rgba(0,0,0,.4);
  }
  .enterbtn:active{transform:translate(2px,2px);box-shadow:none;}

    flex:0 0 auto;text-align:center;
    min-height:18px;
    font-size:clamp(10px,2.8vw,12px);letter-spacing:.3px;
    color:var(--dim2);margin-bottom:5px;

  #message.err{color:var(--red);}

    border:2px solid var(--line);
    padding:8px 4px;
    font-family:inherit;font-size:clamp(10px,2.8vw,12px);font-weight:700;letter-spacing:1px;

  }

  #controls button:disabled{opacity:.35;cursor:default;}

    height:clamp(30px,8vw,40px);

    border:2px solid var(--line);

    box-shadow:8px 8px 0 0 var(--red);

  }

  .winrating{margin-top:2px;font-size:clamp(12px,3.4vw,15px);color:var(--bone);letter-spacing:2px;font-weight:700;}
  #winchain{

  #winstats b{color:var(--bone);}

  .winbtns button{
    flex:1 1 0;
    padding:11px 6px;
    font-family:inherit;font-size:clamp(11px,3vw,13px);font-weight:800;letter-spacing:1px;
    cursor:pointer;touch-action:manipulation;border:2px solid var(--bone);
  }
  #winNew{background:var(--red);color:#fff;border-color:var(--red);}
  #winClose{background:var(--panel);color:var(--bone);}
  #winNew:active,#winClose:active{transform:translate(1px,1px);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">WORD<b>·</b>LADDER</div>
    <div class="sub">Change ONE letter at a time; every rung must be a real word.</div>
  </header>

  <div id="topbar">
    <div class="goalcard">
      <span><span class="lab">FROM</span> <span class="w" id="startWord">----</span></span>
      <span class="arrow">&#10230;</span>
      <span><span class="lab">TO</span> <span class="w t" id="targetWord">----</span></span>
    </div>
    <div class="stats">
      <div class="stat"><span class="k">STEPS</span><span class="v" id="stepsVal">0</span></div>
      <div class="stat"><span class="k">PAR</span><span class="v" id="parVal">0</span></div>
    </div>
    <div class="diffrow">
      <div class="grp" id="diffGrp">
        <button class="diffbtn" data-diff="easy">EASY</button>
        <button class="diffbtn active" data-diff="medium">MEDIUM</button>
        <button class="diffbtn" data-diff="hard">HARD</button>
      </div>
      <button class="newbtn" id="newBtn">NEW &#8635;</button>
    </div>
  </div>

  <div id="ladder"></div>

  <div id="stepLabel"></div>
  <div id="inputRow"></div>
  <div id="message"></div>

  <div id="controls">
    <button id="undoBtn">&#8624; UNDO</button>
    <button id="hintBtn">&#9788; HINT</button>
    <button id="resetBtn">&#8635; RESET</button>
  </div>

  <div id="keyboard"></div>
</div>

<div id="win" class="hidden">
  <div class="winpanel">
    <div class="wintitle">SOLVED</div>
    <div class="winrating" id="winRating"></div>
    <div id="winchain"></div>
    <div id="winstats"></div>
    <div class="winbtns">
      <button id="winNew">NEW PUZZLE</button>
      <button id="winClose">VIEW BOARD</button>
    </div>
  </div>
</div>

    "this thud thug thus tick tide tidy tied tier ties tile till tilt time tins "+
    "tint tiny tips tire toad toes tofu toga toil told toll tomb tome tone tons "+
    "took tool toot tops tore torn toss tote tots tour tout town tows toys tram "+
    "trap tray tree trek trim trio trip trod trot true tuba tube tubs tuck tuft "+
    "tugs tuna tune turf turn tusk tutu twig twin type typo "+
    "ugly undo unit unto upon urge used user uses "+
    "vain vale vane vary vase vast veal veer veil vein vent verb very vest veto "+
    "vial vibe vice view vile vine visa void volt vote vows "+
    "wade wage wail wait wake walk wall wand wane want ward ware warm warn warp "+
    "wars wart wary wash wasp watt wave wavy waxy ways weak wean wear webs weed "+
    "week weep weld well welt went wept were west what when whim whip whom wick "+
    "wide wife wild will wilt wimp wind wine wing wink wins wipe wire wise wish "+
    "wisp woke wolf womb wood woof wool word wore work worm worn wove wrap wren "+
    "yank yard yarn yawn yeah year yell yelp yoga yoke yolk your "+
    "zany zeal zero zest zinc zone zoom";

  // Build the word set + list (defensive: only length-4, deduped, uppercased).
  var DICT = Object.create(null);
  var WORDS = [];
  (function(){
    var toks = RAW.split(/\s+/);
    for(var i=0;i<toks.length;i++){
      var w = toks[i].toUpperCase();
      if(w.length===4 && /^[A-Z]{4}$/.test(w) && !DICT[w]){
        DICT[w]=true; WORDS.push(w);
      }
    }
  })();

  /* =====================================================================
     ADJACENCY GRAPH: neighbours differ by exactly one letter.
  ===================================================================== */
  var ADJ = Object.create(null);
  (function(){
    for(var i=0;i<WORDS.length;i++) ADJ[WORDS[i]]=[];
    for(var w in ADJ){
      var arr = ADJ[w];
      for(var pos=0;pos<4;pos++){
        for(var c=65;c<=90;c++){
          var ch = String.fromCharCode(c);
          if(ch===w.charAt(pos)) continue;
          var nb = w.substring(0,pos)+ch+w.substring(pos+1);
          if(DICT[nb]) arr.push(nb);
        }
      }
    }
  })();

  function bfsDistances(start){
    var dist = Object.create(null);
    dist[start]=0;
    var q=[start], head=0;
    while(head<q.length){
      var w=q[head++]; var d=dist[w]; var nbrs=ADJ[w];
      for(var i=0;i<nbrs.length;i++){
        var nb=nbrs[i];
        if(dist[nb]===undefined){ dist[nb]=d+1; q.push(nb); }
      }
    }
    return dist;
  }

  // Shortest path a->b as an array of words, or null if unreachable.
  function bfsPath(a,b){
    if(a===b) return [a];
    var prev=Object.create(null); prev[a]=null;
    var q=[a], head=0, found=false;
    while(head<q.length){
      var w=q[head++]; var nbrs=ADJ[w];
      for(var i=0;i<nbrs.length;i++){
        var nb=nbrs[i];
        if(prev[nb]===undefined){
          prev[nb]=w;
          if(nb===b){ found=true; break; }
          q.push(nb);
        }
      }
      if(found) break;
    }
    if(prev[b]===undefined) return null;
    var path=[], cur=b;
    while(cur!==null){ path.push(cur); cur=prev[cur]; }
    path.reverse();
    return path;
  }

  function randInt(n){ return Math.floor(Math.random()*n); }
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=randInt(i+1); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  // Difficulty bands = target's shortest distance from start.
  var BANDS = {
    easy:  {min:3, max:4},
    medium:{min:5, max:6},
    hard:  {min:7, max:10}
  };

  // Generate a solvable puzzle whose PAR (true minimum) lands in the band.
  // Falls back gracefully to the farthest available pair, then to a fixed pair.
  function generatePuzzle(diff){
    var band = BANDS[diff] || BANDS.medium;
    var order = shuffle(WORDS.slice());
    var best = null; // {start,target,par}
    var tries = Math.min(order.length, 200);
    for(var a=0;a<tries;a++){
      var s = order[a];
      if(ADJ[s].length===0) continue;
      var dist = bfsDistances(s);
      var inBand = [];
      var far=null, farD=-1;
      for(var w in dist){
        if(w===s) continue;
        var d=dist[w];
        if(d>=band.min && d<=band.max) inBand.push(w);
        if(d>farD){ farD=d; far=w; }
      }
      if(inBand.length){
        var t = inBand[randInt(inBand.length)];
        return {start:s, target:t, par:dist[t]};
      }
      if(far && (best===null || farD>best.par)){
        best = {start:s, target:far, par:farD};
      }
    }
    if(best && best.par>=2) return best;
    // Ultimate fixed fallback (classic doublet, guaranteed connected in DICT).
    var fp = bfsPath("COLD","WARM");
    if(fp) return {start:"COLD", target:"WARM", par:fp.length-1};
    // Absolute last resort: any word with a neighbour.
    for(var i=0;i<WORDS.length;i++){
      if(ADJ[WORDS[i]].length){ return {start:WORDS[i], target:ADJ[WORDS[i]][0], par:1}; }
    }
    return {start:"WORD", target:"WORD", par:0};
  }

  /* =====================================================================
     GAME STATE
  ===================================================================== */
  var state = {
    diff: "medium",
    start: "COLD",
    target: "WARM",
    par: 4,
    chain: ["COLD"],   // ladder rungs, current = last
    input: ["C","O","L","D"],
    cursor: 0,
    hints: 0,
    solved: false
  };

  // ---- element refs ----
  var el = {
    ladder:    document.getElementById("ladder"),
    startWord: document.getElementById("startWord"),
    targetWord:document.getElementById("targetWord"),
    stepsVal:  document.getElementById("stepsVal"),
    parVal:    document.getElementById("parVal"),
    stepLabel: document.getElementById("stepLabel"),
    inputRow:  document.getElementById("inputRow"),
    message:   document.getElementById("message"),
    undoBtn:   document.getElementById("undoBtn"),
    hintBtn:   document.getElementById("hintBtn"),
    resetBtn:  document.getElementById("resetBtn"),
    keyboard:  document.getElementById("keyboard"),
    diffGrp:   document.getElementById("diffGrp"),
    newBtn:    document.getElementById("newBtn"),
    win:       document.getElementById("win"),
    winRating: document.getElementById("winRating"),
    winChain:  document.getElementById("winchain"),
    winStats:  document.getElementById("winstats"),
    winNew:    document.getElementById("winNew"),
    winClose:  document.getElementById("winClose")
  };

  function current(){ return state.chain[state.chain.length-1]; }
  function diffCount(x,y){ var d=0; for(var i=0;i<4;i++) if(x.charAt(i)!==y.charAt(i)) d++; return d; }
  function diffIndex(x,y){ for(var i=0;i<4;i++) if(x.charAt(i)!==y.charAt(i)) return i; return -1; }

  function setMsg(text, kind){
    el.message.textContent = text || "";
    el.message.className = kind || "";
  }

  /* ---------------------------------------------------------------
     RENDER
  --------------------------------------------------------------- */
  function tileEl(ch, cls){
    var d=document.createElement("div");
    d.className="tile"+(cls?(" "+cls):"");
    d.textContent=ch;
    return d;
  }

  function renderLadder(){
    el.ladder.innerHTML="";
    var chain = state.chain;
    for(var r=0;r<chain.length;r++){
      var word = chain[r];
      var row = document.createElement("div");
      row.className = "rung";
      // number
      var num=document.createElement("div"); num.className="num"; num.textContent=r; row.appendChild(num);
      // tiles
      var tiles=document.createElement("div"); tiles.className="tiles";
      var chgAt = (r>0) ? diffIndex(chain[r-1], word) : -1;
      for(var i=0;i<4;i++){
        tiles.appendChild(tileEl(word.charAt(i), i===chgAt ? "chg" : ""));
      }
      row.appendChild(tiles);
      // badge
      if(r===0){
        var b=document.createElement("div"); b.className="badge start"; b.textContent="START"; row.appendChild(b);
      } else if(word===state.target && r===chain.length-1 && state.solved){
        var bw=document.createElement("div"); bw.className="badge win"; bw.textContent="TARGET ✓"; row.appendChild(bw);
      }
      // allow rewind by tapping any earlier rung (not while solved)
      if(!state.solved && r < chain.length-1){
        row.classList.add("click");
        row.title="Rewind the ladder to here";
        (function(idx){
          row.addEventListener("click", function(){ rewindTo(idx); });
        })(r);
      }
      el.ladder.appendChild(row);
    }
    // goal ghost rung (unless the last rung already IS the reached target)
    if(!(state.solved)){
      var goal=document.createElement("div");
      goal.className="rung goal";
      var gn=document.createElement("div"); gn.className="num"; gn.textContent="⚑"; goal.appendChild(gn);
      var gt=document.createElement("div"); gt.className="tiles";
      for(var k=0;k<4;k++) gt.appendChild(tileEl(state.target.charAt(k),"ghost"));
      goal.appendChild(gt);
      var gb=document.createElement("div"); gb.className="badge"; gb.textContent="GOAL"; goal.appendChild(gb);
      el.ladder.appendChild(goal);
    }
    el.ladder.scrollTop = el.ladder.scrollHeight;
  }

  function renderInput(){
    el.inputRow.innerHTML="";
    var cur = current();
    var changed = diffCount(state.input.join(""), cur);
    for(var i=0;i<4;i++){
      var t=document.createElement("div");
      var cls="itile";
      if(i===state.cursor && !state.solved) cls+=" cursor";
      if(state.input[i]!==cur.charAt(i)) cls += (changed>1 ? " over" : " diff");
      t.className=cls;
      t.textContent=state.input[i];
      (function(idx){
        t.addEventListener("click", function(){
          if(state.solved) return;
          state.cursor=idx; renderInput();
        });
      })(i);
      el.inputRow.appendChild(t);
    }
    var enter=document.createElement("button");
    enter.className="enterbtn"; enter.textContent="ENTER ▶";
    enter.addEventListener("click", submit);
    el.inputRow.appendChild(enter);

    // step label
    if(state.solved){
      el.stepLabel.innerHTML = "Puzzle solved. Press NEW for another ladder.";
    } else {
      el.stepLabel.innerHTML = "NEXT RUNG: change one letter of <b>"+current()+"</b>";
    }
  }

  function renderStats(){
    el.startWord.textContent = state.start;
    el.targetWord.textContent = state.target;
    var steps = state.chain.length-1;
    el.stepsVal.textContent = steps;
    el.parVal.textContent = state.par;
    el.stepsVal.className = "v" + (steps>state.par ? " over" : (state.solved ? " good" : ""));
    el.undoBtn.disabled = state.solved || state.chain.length<=1;
    el.hintBtn.disabled = state.solved;
    // active difficulty highlight
    var btns=el.diffGrp.querySelectorAll(".diffbtn");
    for(var i=0;i<btns.length;i++){
      btns[i].classList.toggle("active", btns[i].getAttribute("data-diff")===state.diff);
    }
  }

  function renderAll(){ renderLadder(); renderInput(); renderStats(); }

  /* ---------------------------------------------------------------
     INPUT ACTIONS
  --------------------------------------------------------------- */
  function typeLetter(ch){
    if(state.solved) return;
    state.input[state.cursor]=ch;
    state.cursor = Math.min(3, state.cursor+1);
    setMsg("");
    renderInput();
  }
  function backspace(){
    if(state.solved) return;
    // move cursor left, restoring that tile to the current word's letter
    state.cursor = Math.max(0, state.cursor-1);
    state.input[state.cursor] = current().charAt(state.cursor);
    setMsg("");
    renderInput();
  }
  function moveCursor(dir){
    if(state.solved) return;
    state.cursor = Math.max(0, Math.min(3, state.cursor+dir));
    renderInput();
  }

  function submit(){
    if(state.solved) return;
    var w = state.input.join("");
    var cur = current();
    if(w===cur){ setMsg("Same word; change exactly one letter.","err"); return; }
    var dc = diffCount(w, cur);
    if(dc!==1){ setMsg("Change exactly ONE letter (you changed "+dc+").","err"); return; }
    if(!DICT[w]){ setMsg("“"+w+"” isn’t in the word list.","err"); return; }
    // legal move
    state.chain.push(w);
    state.input = w.split("");
    state.cursor = 0;
    if(w===state.target){
      state.solved = true;
      renderAll();
      showWin();
      return;
    }
    setMsg("Good, "+w+" added.","ok");
    renderAll();
  }

  function undo(){
    if(state.solved) return;
    if(state.chain.length<=1){ setMsg("Nothing to undo.","err"); return; }
    state.chain.pop();
    state.input = current().split("");
    state.cursor = 0;
    setMsg("");
    renderAll();
  }

  function rewindTo(idx){
    if(state.solved) return;
    if(idx<0 || idx>=state.chain.length-1) return;
    state.chain = state.chain.slice(0, idx+1);
    state.input = current().split("");
    state.cursor = 0;
    setMsg("Rewound to step "+idx+".","");
    renderAll();
  }

  function hint(){
    if(state.solved) return;
    var cur = current();
    if(cur===state.target){ return; }
    var path = bfsPath(cur, state.target);
    if(!path || path.length<2){ setMsg("No hint available. Try UNDO.","err"); return; }
    var next = path[1];
    state.input = next.split("");
    state.cursor = diffIndex(cur, next);
    if(state.cursor<0) state.cursor=0;
    state.hints++;
    var left = path.length-2; // remaining optimal steps after this one
    setMsg("Hint: "+next+", press ENTER ("+left+" more to go).","");
    renderInput();
  }

  function resetPuzzle(){
    state.chain = [state.start];
    state.input = state.start.split("");
    state.cursor = 0;
    state.hints = 0;
    state.solved = false;
    hideWin();
    setMsg("Puzzle reset.","");
    renderAll();
  }

  function newPuzzle(diff){
    if(diff) state.diff = diff;
    var p = generatePuzzle(state.diff);
    state.start = p.start;
    state.target = p.target;
    state.par = p.par;
    state.chain = [p.start];
    state.input = p.start.split("");
    state.cursor = 0;
    state.hints = 0;
    state.solved = false;
    hideWin();
    setMsg("New "+state.diff.toUpperCase()+" puzzle, par "+p.par+" steps.","");
    renderAll();
  }

  /* ---------------------------------------------------------------
     WIN OVERLAY  (no score is posted; has_leaderboard = false)
  --------------------------------------------------------------- */
  function showWin(){
    var steps = state.chain.length-1;
    var rating;
    if(steps<=state.par && state.hints===0) rating="PERFECT ★";
    else if(steps<=state.par) rating="OPTIMAL";
    else if(steps<=state.par+2) rating="GREAT";
    else rating="SOLVED";
    el.winRating.textContent = rating;
    // chain display
    var parts=[];
    for(var i=0;i<state.chain.length;i++){
      var w=state.chain[i];
      if(i===state.chain.length-1) parts.push('<b class="t">'+w+'</b>');
      else parts.push('<b>'+w+'</b>');
    }
    el.winChain.innerHTML = parts.join(' <span style="color:var(--dim)">&#8595;</span> ');
    el.winStats.innerHTML =
      "Steps <b>"+steps+"</b> &nbsp;&middot;&nbsp; Par <b>"+state.par+"</b> &nbsp;&middot;&nbsp; Hints <b>"+state.hints+"</b>";
    el.win.classList.remove("hidden");
  }
  function hideWin(){ el.win.classList.add("hidden"); }

  /* ---------------------------------------------------------------
     ON-SCREEN KEYBOARD
  --------------------------------------------------------------- */
  function buildKeyboard(){
    var rows = ["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];
    for(var r=0;r<rows.length;r++){
      var rowEl=document.createElement("div");
      rowEl.className="krow";
      // small offset on 2nd/3rd rows for a staggered look via spacers
      var letters=rows[r].split("");
      for(var i=0;i<letters.length;i++){
        var k=document.createElement("button");
        k.className="key"; k.type="button"; k.textContent=letters[i];
        (function(ch){ k.addEventListener("click", function(){ typeLetter(ch); }); })(letters[i]);
        rowEl.appendChild(k);
      }
      el.keyboard.appendChild(rowEl);
    }
    // control row: DEL + ENTER
    var ctl=document.createElement("div"); ctl.className="krow";
    var del=document.createElement("button");
    del.className="key wide"; del.type="button"; del.innerHTML="&#9003; DEL";
    del.addEventListener("click", backspace);
    var ent=document.createElement("button");
    ent.className="key wide"; ent.type="button"; ent.innerHTML="ENTER &#9166;";
    ent.addEventListener("click", submit);
    ctl.appendChild(del); ctl.appendChild(ent);
    el.keyboard.appendChild(ctl);
  }

  /* ---------------------------------------------------------------
     PHYSICAL KEYBOARD
  --------------------------------------------------------------- */
  window.addEventListener("keydown", function(e){
    if(e.ctrlKey||e.metaKey||e.altKey) return; // never swallow browser shortcuts
    var k=e.key;
    if(!el.win.classList.contains("hidden")){
      // overlay open: Enter = new puzzle, Escape = view board
      if(k==="Enter"){ e.preventDefault(); newPuzzle(); }
      else if(k==="Escape"){ e.preventDefault(); hideWin(); renderAll(); }
      return;
    }
    if(/^[a-zA-Z]$/.test(k)){ e.preventDefault(); typeLetter(k.toUpperCase()); }
    else if(k==="Enter"){ e.preventDefault(); submit(); }
    else if(k==="Backspace"){ e.preventDefault(); backspace(); }
    else if(k==="ArrowLeft"){ e.preventDefault(); moveCursor(-1); }
    else if(k==="ArrowRight"){ e.preventDefault(); moveCursor(1); }
  }, false);

  /* ---------------------------------------------------------------
     WIRE CONTROLS
  --------------------------------------------------------------- */
  el.undoBtn.addEventListener("click", undo);
  el.hintBtn.addEventListener("click", hint);
  el.resetBtn.addEventListener("click", resetPuzzle);
  el.newBtn.addEventListener("click", function(){ newPuzzle(); });
  el.winNew.addEventListener("click", function(){ newPuzzle(); });
  el.winClose.addEventListener("click", function(){ hideWin(); renderAll(); });
  el.diffGrp.addEventListener("click", function(e){
    var b=e.target.closest(".diffbtn");
    if(!b) return;
    newPuzzle(b.getAttribute("data-diff"));
  });

  /* ---------------------------------------------------------------
     BOOT
  --------------------------------------------------------------- */
  buildKeyboard();
  newPuzzle("medium");

})();
</script>

<style data-batchly="hit-targets">/* Batchly mobile hit-target shim: >=44px tappables on phones/touch only */
@media (max-width: 900px), (pointer: coarse){
  .diffbtn,.newbtn{min-height:44px;touch-action:manipulation}
  #controls button{min-height:44px;touch-action:manipulation}
  #keyboard .key{min-height:44px;touch-action:manipulation}
  #inputRow .itile{min-height:44px;min-width:44px}
  #inputRow .enterbtn{min-height:44px;touch-action:manipulation}
  .winbtns button{min-height:44px}
}
</style>
</body>
