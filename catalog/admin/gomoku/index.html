<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Gomoku (five-in-a-row) versus the computer on a 15x15 board. Place stones and be the first to line up five in any direction. Three AI strengths that block and build with real threat-pattern search. No leaderboard: a casual match vs the AI." />
<title>GOMOKU</title>
<!--
  GOMOKU: original five-in-a-row versus an AI, for Batchly.
  =========================================================================
  DESIGN NOTES

  The game
    A classic 15x15 gomoku. Two colours, BLACK and WHITE. Black always moves
    first (the traditional first-move edge). You choose which colour you play;
    the computer takes the other. Stones sit on the LINE INTERSECTIONS of the
    grid (Go-board style). The first side to get FIVE OR MORE of its own stones
    in an unbroken row (horizontal, vertical, or either diagonal) wins. If the
    board fills with no five, it is a draw. This is a versus-AI match, so there
    is NO leaderboard and NO score is ever posted to the parent frame (there is
    deliberately no `batchly-score` postMessage anywhere in this file).

  Never an illegal move
    The AI only ever picks from EMPTY intersections: candidates are generated by
    scanning the board for empty cells that neighbour an existing stone, so a
    move onto an occupied point is structurally impossible.

  The AI  (a real opponent: blocks, builds, and can be beaten)
    Tactics first, then search:
      1. If the AI can complete five right now, it plays that point.
      2. Else if YOU are threatening to complete five next move, it blocks the
         winning point (a double-four that can't be single-blocked is the only
         way past this, and the evaluator works to stop those forming earlier).
      3. Otherwise it searches. Move candidates are limited to points near
         existing stones (bounded branching) and ordered by a fast threat score,
         then explored with a negamax + alpha-beta search whose leaves are scored
         by a line evaluator that recognises open/closed twos, threes, fours and
         open fours. The evaluator weighs the opponent's threats slightly higher
         than its own, so it defends soundly while still building.
    EASY  is a 1-ply greedy player that always takes a win and blocks an immediate
          five, but misses deeper set-ups and sometimes blunders on purpose. Very
          beatable. MEDIUM searches 2 plies. HARD searches up to 4 plies with
          iterative deepening under a time budget, so it plays sharply but is still
          a bounded searcher a careful human can out-plan, never an oracle.

  Fits any screen
    The board is a single square sized to fit the available area and letterboxed,
    so a phone and a desktop play the exact same 15x15 grid. Play with mouse, with
    touch (tap the nearest intersection; snapping is generous), or with the
    keyboard (arrow keys move a cursor, Enter/Space places). Undo retracts your
    last move and the computer's reply.

  Zero dependencies
    No network of any kind. Fonts are system monospace, the board and every stone
    are drawn on a canvas, there are no images and no audio. No localStorage: this
    runs in an opaque-origin sandboxed iframe where storage access throws, so all
    state lives in plain variables and resets with a new game.
  =========================================================================
-->
<style>
  :root{
    --bg:#10100e;
    --panel:#18181d;
    --panel-2:#1f1f26;
    --inset:#0c0c0f;
    --bone:#f5f2e8;
    --mute:#9a9aa8;
    --muted:#a5a294;
    --line:#2e2e36;
    --line2:#3a3a46;
    --accent:#ef3a3a;
    --good:#5dd39e;
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace;
  }
  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg); color:var(--bone);
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%;
  }

  #app{
    height:100%;
    display:flex; flex-direction:column; gap:8px;
    padding:8px;
  }

  /* ---------- top bar ---------- */
  #bar{
    flex:0 0 auto;
    display:flex; flex-wrap:wrap; align-items:center; gap:8px;
    background:var(--panel); border:2px solid var(--line);
    padding:6px;
  }
  #brand{
    display:flex; align-items:center; gap:7px;
    font-size:13px; font-weight:700; letter-spacing:.18em;
    padding:0 4px 0 2px; white-space:nowrap;
  }
  #brand i{ width:11px; height:11px; background:var(--accent); display:block; }
  .group{ display:flex; align-items:center; gap:6px; }
  .spacer{ flex:1 1 auto; min-width:0; }

  button{
    font-family:var(--mono);
    font-size:11px; font-weight:700; letter-spacing:.08em;
    background:#22222a; color:var(--bone);
    border:2px solid var(--bone); border-radius:0;
    padding:6px 9px; margin:0; cursor:pointer;
    box-shadow:3px 3px 0 0 #000;
    transition:transform .06s ease, box-shadow .06s ease, background .1s ease;
    white-space:nowrap;
  }
  button:hover{ background:#2f2f3a; }
  button:active{ transform:translate(3px,3px); box-shadow:0 0 0 0 #000; }
  button:disabled{ opacity:.4; cursor:not-allowed; box-shadow:2px 2px 0 0 #000; }
  button:disabled:hover{ background:#22222a; }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  button.primary{ background:var(--accent); color:#10100e; border-color:var(--bone); }
  button.primary:hover{ background:#ff4a4a; }

  /* segmented difficulty control */
  #diff{ display:flex; border:2px solid var(--line2); background:var(--inset); }
  #diff button{
    border:none; box-shadow:none; background:transparent; color:var(--mute);
    padding:6px 10px; letter-spacing:.1em;
  }
  #diff button + button{ border-left:2px solid var(--line2); }
  #diff button:hover{ background:#20202a; color:var(--bone); }
  #diff button[aria-pressed="true"]{ background:var(--accent); color:#10100e; }
  #diff button:active{ transform:none; }
  #diff button:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }

  .count{
    display:flex; align-items:center; gap:7px;
    background:var(--inset); border:2px solid var(--line2);
    padding:4px 9px;
  }
  .count span{ font-size:9px; letter-spacing:.14em; color:var(--mute); }
  .count b{
    font-size:15px; font-weight:700; letter-spacing:.06em; color:var(--bone);
    font-variant-numeric:tabular-nums; min-width:1ch; text-align:right;
  }

  /* ---------- board ---------- */
  #wrap{
    flex:1 1 auto; min-height:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--inset); border:2px solid var(--line);
    padding:6px;
    overflow:hidden;
  }
  canvas{
    display:block; margin:auto;
    background:transparent;
    touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    outline:none;
  }
  canvas:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- footer ---------- */
  #foot{
    flex:0 0 auto;
    background:var(--panel); border:2px solid var(--line);
    padding:7px 9px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  #status{
    font-size:12px; font-weight:700; letter-spacing:.08em;
    display:flex; align-items:center; gap:9px; min-width:0;
  }
  #status .dot{ width:12px; height:12px; display:block; border:2px solid var(--line2); flex:0 0 auto; }
  #status .dot.black{ background:radial-gradient(circle at 35% 32%, #4a463c, #100f0c 70%); border-color:#4a463c; }
  #status .dot.white{ background:radial-gradient(circle at 35% 32%, #ffffff, #cfc9b7 72%); border-color:#cfc9b7; }
  #status .txt .ok{ color:var(--good); }
  #status .txt .bad{ color:var(--accent); }
  #status .txt .warn{ color:#f5b23a; }
  #status .think{ color:var(--mute); }
  #status .think b{ color:var(--bone); }
  @keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
  #status .ellip{ animation:blink 1s steps(1,end) infinite; }

  .legend{ display:flex; align-items:center; gap:14px; font-size:9px; letter-spacing:.12em; color:var(--mute); flex-wrap:wrap; }
  .legend b{ display:inline-flex; align-items:center; gap:6px; font-weight:700; color:var(--bone); }
  .legend .sw{ width:13px; height:13px; display:block; border:1px solid var(--line2); }
  .legend .sw.black{ background:radial-gradient(circle at 35% 32%, #4a463c, #100f0c 70%); }
  .legend .sw.white{ background:radial-gradient(circle at 35% 32%, #ffffff, #cfc9b7 72%); }
  .legend .sw.last{ border:2px solid var(--accent); background:transparent; }
  .legend .sw.win{ background:var(--accent); }

  #help{ font-size:10px; line-height:1.5; color:var(--mute); letter-spacing:.02em; flex:1 1 240px; min-width:0; }
  #help b{ color:var(--bone); font-weight:700; }
  #help kbd{
    font-family:var(--mono); font-size:10px; color:var(--bone);
    background:var(--inset); border:1px solid var(--line2);
    padding:0 4px; margin:0 1px;
  }
  #help .sep{ color:#4d4d5c; padding:0 3px; }

  /* ---------- overlay ---------- */
  #over{
    position:fixed; inset:0; z-index:20;
    display:none; place-items:center;
    background:rgba(8,8,10,.82);
    padding:16px;
  }
  #over.show{ display:grid; }
  #card{
    width:100%; max-width:420px;
    background:var(--panel);
    border:2px solid var(--bone);
    box-shadow:6px 6px 0 0 #000;
    padding:18px 16px 16px;
    text-align:center;
  }
  #ovTitle{ font-size:26px; font-weight:700; letter-spacing:.14em; margin:0 0 3px; line-height:1.1; }
  #ovTitle.win{ color:var(--good); }
  #ovTitle.lose{ color:var(--accent); }
  #ovSub{ font-size:10px; letter-spacing:.16em; color:var(--mute); margin-bottom:14px; }
  #ovNote{ font-size:11px; line-height:1.6; color:var(--mute); letter-spacing:.02em; margin-bottom:14px; }
  #ovNote b{ color:var(--bone); font-weight:700; }
  #ovBtns{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  #ovBtns button{ font-size:12px; padding:9px 16px; }

  @media (max-width:560px){
    #brand span{ display:none; }
    #help .extra{ display:none; }
  }
  @media (max-width:440px){
    #foot{ gap:9px; }
    #cntWrap{ display:none; }
  }
  @media (prefers-reduced-motion:reduce){
    button, #status .ellip{ transition:none; animation:none; }
  }
</style>
</head>
<body>
<div id="app">

  <header id="bar">
    <div id="brand"><i></i><span>GOMOKU</span></div>

    <div id="diff" role="group" aria-label="Computer difficulty">
      <button data-diff="easy"   aria-pressed="false" title="Easy computer">EASY</button>
      <button data-diff="medium" aria-pressed="true"  title="Medium computer">MEDIUM</button>
      <button data-diff="hard"   aria-pressed="false" title="Hard computer">HARD</button>
    </div>

    <div class="group">
      <button id="side" title="Switch which colour you play (starts a new game)">YOU: BLACK</button>
    </div>

    <div class="spacer"></div>

    <div id="cntWrap" class="count" title="Stones placed this game"><span>MOVES</span><b id="moves">0</b></div>

    <div class="group">
      <button id="undo" title="Undo your last move (U)" disabled>UNDO</button>
      <button id="newgame" class="primary" title="New game (N)">NEW GAME</button>
    </div>
  </header>

  <main id="wrap">
    <canvas id="board" tabindex="0" role="img"
      aria-label="Gomoku board, 15 by 15. Place stones to make five in a row. Use arrow keys to move the cursor and Enter to place, or tap an intersection."></canvas>
  </main>

  <footer id="foot">
    <div id="status" aria-live="polite"><span class="dot black" id="turnDot"></span><span class="txt" id="statusTxt">Your move</span></div>

    <div class="legend" aria-hidden="true">
      <b><span class="sw black"></span>BLACK</b>
      <b><span class="sw white"></span>WHITE</b>
      <b><span class="sw last"></span>LAST</b>
      <b><span class="sw win"></span>FIVE</b>
    </div>

    <div id="help">
      <b>PLACE</b> tap / click an intersection <span class="sep">&middot;</span>
      <kbd>&#8592;&#8593;&#8594;&#8595;</kbd> move <span class="sep">&middot;</span> <kbd>Enter</kbd> place
      <span class="extra"><span class="sep">&middot;</span> <kbd>U</kbd> undo <span class="sep">&middot;</span> <kbd>N</kbd> new</span>
      <br>
      Line up <b>five in a row</b> (any direction) before the computer does. Casual match vs the AI, so no score is recorded.
    </div>
  </footer>

</div>

<div id="over" role="dialog" aria-modal="false" aria-labelledby="ovTitle">
  <div id="card">
    <div id="ovTitle">GOMOKU</div>
    <div id="ovSub">FIVE IN A ROW</div>
    <div id="ovNote"></div>
    <div id="ovBtns">
      <button id="ovPrimary" class="primary">PLAY AGAIN</button>
      <button id="ovClose">VIEW BOARD</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============================ constants ============================ */
  const N = 15;                 // board is N x N intersections
  const EMPTY = 0, BLACK = 1, WHITE = 2;
  const DIRS = [[1,0],[0,1],[1,1],[1,-1]];
  const INF = 1e9;
  const WIN_SCORE = 900000;     // returned when a five is found in search

  // pattern values used by the line evaluator (per player, per direction)
  const V_FIVE  = 10000000;
  const V_OPEN4 = 100000;       // _XXXX_  (unstoppable next move)
  const V_FOUR  = 10000;        // XXXX_   (one winning point, blockable)
  const V_OPEN3 = 8000;         // _XXX_   (becomes an open four)
  const V_THREE = 500;          // blocked three
  const V_OPEN2 = 600;
  const V_TWO   = 100;
  const V_OPEN1 = 20;
  const V_ONE   = 5;

  const DIFF = {
    easy:   { mode:'greedy', radius:2, blunder:0.28 },
    medium: { mode:'search', maxDepth:2, radius:2, topRoot:12, topNode:10, budget:700 },
    hard:   { mode:'search', maxDepth:4, radius:2, topRoot:12, topNode:8,  budget:900 }
  };

  /* ============================ state ============================ */
  const board = new Int8Array(N*N);   // idx = y*N + x
  let human = BLACK;                   // colour the player controls
  let ai = WHITE;
  let turn = BLACK;                    // whose move it is (BLACK always starts)
  let difficulty = 'medium';
  let moveCount = 0;
  let gameOver = false;
  let winner = 0;                      // 0 none, 1/2 colour, 3 = draw
  let winLine = null;                  // array of [x,y] for the winning run
  let lastMove = null;                 // [x,y] of the most recent stone
  let history = [];                    // {x,y,p}
  let thinking = false;
  let aiGen = 0;                       // bumped on new game / undo: invalidates a pending AI move
  const cursor = { x:7, y:7 };
  let showCursor = false;              // keyboard cursor visibility
  let hover = null;                    // [x,y] under the mouse, or null

  // search bookkeeping
  let deadline = 0, timedOut = false;
  const scratch = new Int8Array(N);    // reused line buffer for the evaluator
  let LINES = null;                    // precomputed index lists for every board line

  /* ============================ dom ============================ */
  const cv = document.getElementById('board');
  const ctx = cv.getContext('2d');
  const wrap = document.getElementById('wrap');
  const statusTxt = document.getElementById('statusTxt');
  const turnDot = document.getElementById('turnDot');
  const movesEl = document.getElementById('moves');
  const undoBtn = document.getElementById('undo');
  const newBtn = document.getElementById('newgame');
  const sideBtn = document.getElementById('side');
  const diffWrap = document.getElementById('diff');
  const over = document.getElementById('over');
  const ovTitle = document.getElementById('ovTitle');
  const ovSub = document.getElementById('ovSub');
  const ovNote = document.getElementById('ovNote');
  const ovPrimary = document.getElementById('ovPrimary');
  const ovClose = document.getElementById('ovClose');

  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* ============================ helpers ============================ */
  const idx = (x,y) => y*N + x;
  const inb = (x,y) => x>=0 && y>=0 && x<N && y<N;

  function buildLines(){
    // every maximal board line of length >= 5, as a list of flat indices
    const lines = [];
    const starts = [
      { dir:[1,0],  test:(x,y)=> x===0 },                 // rows
      { dir:[0,1],  test:(x,y)=> y===0 },                 // cols
      { dir:[1,1],  test:(x,y)=> x===0 || y===0 },        // '\' diagonals
      { dir:[1,-1], test:(x,y)=> x===0 || y===N-1 }       // '/' diagonals
    ];
    for(const s of starts){
      const [dx,dy] = s.dir;
      for(let y=0;y<N;y++){
        for(let x=0;x<N;x++){
          if(!s.test(x,y)) continue;
          const cells = [];
          let cx=x, cy=y;
          while(inb(cx,cy)){ cells.push(idx(cx,cy)); cx+=dx; cy+=dy; }
          if(cells.length >= 5) lines.push(cells);
        }
      }
    }
    return lines;
  }

  /* ---------- win / threat detection ---------- */

  // Would placing colour p at (x,y) make five-or-more? (does not mutate board)
  function winAt(x,y,p){
    for(const [dx,dy] of DIRS){
      let c = 1;
      let nx=x+dx, ny=y+dy;
      while(inb(nx,ny) && board[idx(nx,ny)]===p){ c++; nx+=dx; ny+=dy; }
      nx=x-dx; ny=y-dy;
      while(inb(nx,ny) && board[idx(nx,ny)]===p){ c++; nx-=dx; ny-=dy; }
      if(c>=5) return true;
    }
    return false;
  }

  // full winning run through (x,y) for colour p (board already holds the stone)
  function winLineFrom(x,y,p){
    for(const [dx,dy] of DIRS){
      // walk to the start of the run
      let sx=x, sy=y;
      while(inb(sx-dx,sy-dy) && board[idx(sx-dx,sy-dy)]===p){ sx-=dx; sy-=dy; }
      const cells = [];
      let cx=sx, cy=sy;
      while(inb(cx,cy) && board[idx(cx,cy)]===p){ cells.push([cx,cy]); cx+=dx; cy+=dy; }
      if(cells.length>=5) return cells;
    }
    return null;
  }

  function hasNeighbor(x,y,r){
    for(let dy=-r; dy<=r; dy++){
      for(let dx=-r; dx<=r; dx++){
        if(dx===0 && dy===0) continue;
        const nx=x+dx, ny=y+dy;
        if(inb(nx,ny) && board[idx(nx,ny)]!==EMPTY) return true;
      }
    }
    return false;
  }

  // first empty point where colour p completes five, or null
  function findImmediateWin(p){
    for(let y=0;y<N;y++){
      for(let x=0;x<N;x++){
        if(board[idx(x,y)]!==EMPTY) continue;
        if(!hasNeighbor(x,y,1)) continue;
        if(winAt(x,y,p)) return [x,y];
      }
    }
    return null;
  }

  // every empty point where colour p completes five
  function findAllImmediateWins(p){
    const out = [];
    for(let y=0;y<N;y++){
      for(let x=0;x<N;x++){
        if(board[idx(x,y)]!==EMPTY) continue;
        if(!hasNeighbor(x,y,1)) continue;
        if(winAt(x,y,p)) out.push([x,y]);
      }
    }
    return out;
  }

  /* ---------- evaluation ---------- */

  // value of a maximal run of length `len` with `ls`/`rs` empty cells beyond each end
  function runVal(len, ls, rs){
    if(len>=5) return V_FIVE;
    if(len + ls + rs < 5) return 0;               // dead: can never reach five
    const ends = (ls>0?1:0) + (rs>0?1:0);
    switch(len){
      case 4: return ends>=2 ? V_OPEN4 : V_FOUR;
      case 3: return ends>=2 ? V_OPEN3 : V_THREE;
      case 2: return ends>=2 ? V_OPEN2 : V_TWO;
      default:return ends>=2 ? V_OPEN1 : V_ONE;   // len 1
    }
  }

  // score a single line (array a of length n, values EMPTY/stone/anything-else) for colour p
  function scoreLineArr(a, n, p){
    let s = 0, i = 0;
    while(i < n){
      if(a[i]===p){
        let j = i+1;
        while(j<n && a[j]===p) j++;
        const len = j - i;
        let ls=0, k=i-1; while(k>=0   && a[k]===EMPTY){ ls++; k--; }
        let rs=0; k=j;     while(k<n   && a[k]===EMPTY){ rs++; k++; }
        s += runVal(len, ls, rs);
        i = j;
      } else i++;
    }
    return s;
  }

  // whole-board pattern score for colour p
  function lineEval(p){
    let total = 0;
    for(let li=0; li<LINES.length; li++){
      const line = LINES[li];
      const m = line.length;
      for(let k=0;k<m;k++) scratch[k] = board[line[k]];
      total += scoreLineArr(scratch, m, p);
    }
    return total;
  }

  // static evaluation from the perspective of colour p (defence weighted a touch higher)
  function evaluate(p){
    const opp = (p===BLACK)?WHITE:BLACK;
    return lineEval(p) - 1.2 * lineEval(opp);
  }

  // fast local threat score for a hypothetical stone of `color` at (x,y); used for move ordering
  function pointScore(x,y,color){
    let s = 0;
    for(const [dx,dy] of DIRS){
      const a = scratch;               // borrow the scratch buffer (length >= 9)
      for(let k=-4;k<=4;k++){
        const nx=x+dx*k, ny=y+dy*k;
        const ai2 = k+4;
        if(k===0) a[ai2] = color;
        else if(!inb(nx,ny)) a[ai2] = -1;      // wall: not empty, not `color`
        else a[ai2] = board[idx(nx,ny)];
      }
      s += scoreLineArr(a, 9, color);
    }
    return s;
  }

  /* ---------- candidate generation ---------- */
  function genCandidates(p, limit, radius){
    const opp = (p===BLACK)?WHITE:BLACK;
    const list = [];
    for(let y=0;y<N;y++){
      for(let x=0;x<N;x++){
        if(board[idx(x,y)]!==EMPTY) continue;
        if(!hasNeighbor(x,y,radius)) continue;
        const sc = pointScore(x,y,p) + 0.85*pointScore(x,y,opp);
        list.push([x,y,sc]);
      }
    }
    list.sort((a,b)=> b[2]-a[2]);
    const out = [];
    const lim = Math.min(limit, list.length);
    for(let i=0;i<lim;i++) out.push([list[i][0], list[i][1]]);
    return out;
  }

  function anyEmpty(){
    for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(board[idx(x,y)]===EMPTY) return [x,y];
    return null;
  }

  /* ---------- negamax search ---------- */
  function search(depth, alpha, beta, p, cfg, isRoot){
    if(performance.now() > deadline){ timedOut = true; return { score:evaluate(p), move:null }; }

    // if we can win right now, do it (prefer faster wins via +depth)
    const w = findImmediateWin(p);
    if(w) return { score: WIN_SCORE + depth, move: w };

    if(depth===0) return { score: evaluate(p), move:null };

    const opp = (p===BLACK)?WHITE:BLACK;

    // if the opponent threatens an immediate five, we can only respond by taking
    // one of those points (blocking): a hugely pruned, correct move set
    let cands;
    const oppWins = findAllImmediateWins(opp);
    if(oppWins.length){
      cands = oppWins;
    } else {
      cands = genCandidates(p, isRoot ? cfg.topRoot : cfg.topNode, cfg.radius);
    }
    if(!cands.length){
      const e = anyEmpty();
      return { score: evaluate(p), move: e };
    }

    let best = -INF, bestMove = cands[0];
    for(let i=0;i<cands.length;i++){
      const x = cands[i][0], y = cands[i][1];
      board[idx(x,y)] = p;
      const child = search(depth-1, -beta, -alpha, opp, cfg, false);
      board[idx(x,y)] = EMPTY;
      const sc = -child.score;
      if(sc > best){ best = sc; bestMove = [x,y]; }
      if(best > alpha) alpha = best;
      if(alpha >= beta) break;
      if(timedOut) break;
    }
    return { score: best, move: bestMove };
  }

  /* ---------- top-level AI move ---------- */
  function chooseMove(){
    const cfg = DIFF[difficulty];

    // opening: take the centre
    if(moveCount===0) return [7,7];

    // 1) win outright
    const win = findImmediateWin(ai);
    if(win) return win;

    // 2) block the player's immediate five (pick the block that helps us most)
    const blocks = findAllImmediateWins(human);
    if(blocks.length){
      blocks.sort((a,b)=> pointScore(b[0],b[1],ai) - pointScore(a[0],a[1],ai));
      return blocks[0];
    }

    if(cfg.mode==='greedy'){
      const cands = genCandidates(ai, 60, cfg.radius);
      if(!cands.length) return anyEmpty();
      if(Math.random() < cfg.blunder){
        const k = Math.min(cands.length, 8);
        return cands[(Math.random()*k)|0];
      }
      return cands[0];
    }

    // 3) search with iterative deepening under a time budget
    deadline = performance.now() + cfg.budget;
    let best = null;
    for(let d=2; d<=cfg.maxDepth; d+=2){
      timedOut = false;
      const r = search(d, -INF, INF, ai, cfg, true);
      if(timedOut) break;
      if(r && r.move){
        best = r.move;
        if(r.score >= WIN_SCORE) break;   // found a forced win: stop deepening
      }
    }
    if(best) return best;
    const fallback = genCandidates(ai, 12, cfg.radius);
    return (fallback[0]) || anyEmpty();
  }

  /* ============================ game flow ============================ */
  function placeStone(x,y,p){
    board[idx(x,y)] = p;
    lastMove = [x,y];
    moveCount++;
    history.push({x,y,p});
    animateStone(x,y);
    const wl = winLineFrom(x,y,p);
    if(wl){
      winner = p; winLine = wl; gameOver = true;
    } else if(moveCount >= N*N){
      winner = 3; gameOver = true;      // draw: board full
    }
  }

  function humanPlace(x,y){
    if(gameOver || thinking) return;
    if(turn !== human) return;
    if(!inb(x,y) || board[idx(x,y)]!==EMPTY) return;
    placeStone(x,y,human);
    afterMove();
  }

  function aiTurn(){
    if(gameOver) return;
    thinking = true;
    const gen = aiGen;                 // capture; a New Game / Undo mid-think bumps aiGen
    updateUI();
    draw();
    // defer so the "thinking" status paints before the (synchronous) search runs
    setTimeout(()=>{
      if(gen !== aiGen) return;        // superseded by a fresh game: do NOT touch new state
      if(gameOver){ thinking=false; return; }
      let mv = chooseMove();
      if(!mv || board[idx(mv[0],mv[1])]!==EMPTY) mv = anyEmpty();  // safety net: never illegal
      if(mv) placeStone(mv[0], mv[1], ai);
      thinking = false;
      afterMove();
    }, reduceMotion ? 60 : 220);
  }

  function afterMove(){
    if(gameOver){
      updateUI(); draw(); showOverlay();
      return;
    }
    turn = (turn===BLACK)?WHITE:BLACK;
    updateUI(); draw();
    if(turn===ai) aiTurn();
  }

  function newGame(){
    aiGen++;                            // cancel any AI move still pending from the previous game
    board.fill(EMPTY);
    turn = BLACK;
    moveCount = 0;
    gameOver = false;
    winner = 0;
    winLine = null;
    lastMove = null;
    history = [];
    thinking = false;
    anim = null;
    cursor.x = 7; cursor.y = 7;
    hideOverlay();
    updateUI();
    draw();
    if(turn===ai) aiTurn();
  }

  function undo(){
    if(thinking) return;
    aiGen++;                            // invalidate any stale pending AI move
    // remove trailing AI move(s), then one human move, back to your last decision
    let removedHuman = false;
    while(history.length){
      const last = history[history.length-1];
      if(last.p===ai && !removedHuman){
        history.pop(); board[idx(last.x,last.y)] = EMPTY; moveCount--;
      } else if(last.p===human){
        history.pop(); board[idx(last.x,last.y)] = EMPTY; moveCount--;
        removedHuman = true; break;
      } else break;
    }
    if(!removedHuman && !history.length) { /* nothing human to undo */ }
    gameOver = false; winner = 0; winLine = null;
    lastMove = history.length ? [history[history.length-1].x, history[history.length-1].y] : null;
    turn = (moveCount % 2 === 0) ? BLACK : WHITE;
    hideOverlay();
    updateUI();
    draw();
    if(!gameOver && turn===ai) aiTurn();
  }

  /* ============================ overlay ============================ */
  function showOverlay(){
    let t, cls, note;
    if(winner===human){
      t = 'YOU WIN'; cls='win';
      note = 'Five in a row. You beat the <b>'+difficulty.toUpperCase()+'</b> computer. No score is recorded: this is a casual match vs the AI.';
    } else if(winner===ai){
      t = 'COMPUTER WINS'; cls='lose';
      note = 'The <b>'+difficulty.toUpperCase()+'</b> computer got five first. Try again, switch sides, or drop the difficulty.';
    } else {
      t = 'DRAW'; cls='';
      note = 'The board filled with no five in a row. A rare, hard-fought stalemate.';
    }
    ovTitle.textContent = t;
    ovTitle.className = cls;
    ovSub.textContent = 'GOMOKU · ' + difficulty.toUpperCase();
    ovNote.innerHTML = note;
    over.classList.add('show');
    ovPrimary.focus();
  }
  function hideOverlay(){ over.classList.remove('show'); }

  /* ============================ ui chrome ============================ */
  function updateUI(){
    movesEl.textContent = moveCount;
    sideBtn.textContent = 'YOU: ' + (human===BLACK ? 'BLACK' : 'WHITE');
    undoBtn.disabled = thinking || !history.some(h=>h.p===human);

    // status line
    turnDot.className = 'dot ' + (turn===BLACK ? 'black' : 'white');
    if(gameOver){
      if(winner===human){ statusTxt.innerHTML = '<span class="ok">You win: five in a row!</span>'; }
      else if(winner===ai){ statusTxt.innerHTML = '<span class="bad">Computer wins.</span>'; }
      else { statusTxt.innerHTML = '<span class="warn">Draw: board full.</span>'; }
      turnDot.className = 'dot ' + (winner===BLACK ? 'black' : winner===WHITE ? 'white' : '');
    } else if(thinking){
      statusTxt.innerHTML = '<span class="think"><b>Computer</b> thinking<span class="ellip">…</span></span>';
    } else if(turn===human){
      statusTxt.innerHTML = 'Your move <span class="think">(' + (human===BLACK?'black':'white') + ')</span>';
    } else {
      statusTxt.innerHTML = '<span class="think">Computer to move</span>';
    }

    // difficulty pressed-state
    for(const b of diffWrap.querySelectorAll('button')){
      b.setAttribute('aria-pressed', b.dataset.diff===difficulty ? 'true' : 'false');
    }
    cv.setAttribute('aria-label',
      'Gomoku board 15 by 15. ' +
      (gameOver ? (winner===human?'You win.':winner===ai?'Computer wins.':'Draw.') :
       (turn===human?'Your move.':'Computer to move.')) +
      ' ' + moveCount + ' stones placed.');
  }

  /* ============================ rendering ============================ */
  let S=0, cell=0, ox=0, oy=0, radius=0, dpr=1, showLabels=false;

  // stone placement pop animation
  let anim = null;   // { x, y, t0 }
  let rafId = 0;
  function animateStone(x,y){
    if(reduceMotion){ anim=null; return; }
    anim = { x, y, t0: performance.now() };
    ensureRaf();
  }
  function ensureRaf(){
    if(rafId) return;
    const step = ()=>{
      rafId = 0;
      let more = false;
      draw();
      if(anim){
        if(performance.now() - anim.t0 < 150) more = true;
        else anim = null;
      }
      if(winLine && !reduceMotion) more = true;   // gentle pulse while a win shows
      if(more){ rafId = requestAnimationFrame(step); }
    };
    rafId = requestAnimationFrame(step);
  }

  function resize(){
    const w = wrap.clientWidth, h = wrap.clientHeight;
    S = Math.max(160, Math.floor(Math.min(w, h)));
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.style.width = S + 'px';
    cv.style.height = S + 'px';
    cv.width = Math.round(S * dpr);
    cv.height = Math.round(S * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // margin leaves room for edge stones + coordinate labels
    const margin = Math.max(16, S * 0.048);
    cell = (S - 2*margin) / (N-1);
    ox = margin; oy = margin;
    radius = cell * 0.42;
    showLabels = cell >= 22;
    draw();
  }

  function gx(x){ return ox + x*cell; }
  function gy(y){ return oy + y*cell; }

  function drawStone(px,py,p,r,alpha){
    ctx.save();
    ctx.globalAlpha = alpha==null ? 1 : alpha;
    // soft drop shadow
    ctx.beginPath(); ctx.arc(px+ r*0.14, py + r*0.16, r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();

    const g = ctx.createRadialGradient(px - r*0.32, py - r*0.36, r*0.15, px, py, r);
    if(p===BLACK){
      g.addColorStop(0, '#54503f'); g.addColorStop(0.45, '#2a2820'); g.addColorStop(1, '#0d0c09');
    } else {
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#eae3d1'); g.addColorStop(1, '#c3bca8');
    }
    ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = Math.max(1, r*0.09);
    ctx.strokeStyle = p===BLACK ? 'rgba(90,86,70,0.7)' : 'rgba(140,134,116,0.85)';
    ctx.stroke();
    // specular dot
    ctx.beginPath(); ctx.arc(px - r*0.3, py - r*0.34, r*0.2, 0, Math.PI*2);
    ctx.fillStyle = p===BLACK ? 'rgba(255,248,225,0.18)' : 'rgba(255,255,255,0.75)';
    ctx.fill();
    ctx.restore();
  }

  function draw(){
    if(!S) return;
    ctx.clearRect(0,0,S,S);

    // board panel
    ctx.fillStyle = '#17150f';
    ctx.fillRect(0,0,S,S);
    // outer frame
    ctx.lineWidth = 2; ctx.strokeStyle = '#4a4638';
    ctx.strokeRect(1,1,S-2,S-2);

    // grid
    ctx.lineWidth = 1; ctx.strokeStyle = '#3b372c';
    ctx.beginPath();
    for(let i=0;i<N;i++){
      ctx.moveTo(gx(i)+0.5, gy(0)); ctx.lineTo(gx(i)+0.5, gy(N-1));
      ctx.moveTo(gx(0), gy(i)+0.5); ctx.lineTo(gx(N-1), gy(i)+0.5);
    }
    ctx.stroke();

    // star points (hoshi)
    const stars = [[3,3],[11,3],[3,11],[11,11],[7,7]];
    ctx.fillStyle = '#5a5646';
    for(const [sx,sy] of stars){
      ctx.beginPath(); ctx.arc(gx(sx), gy(sy), Math.max(2, cell*0.06), 0, Math.PI*2); ctx.fill();
    }

    // coordinate labels
    if(showLabels){
      ctx.fillStyle = '#6f6a58';
      ctx.font = Math.round(Math.min(12, cell*0.32)) + "px 'JetBrains Mono', ui-monospace, monospace";
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const letters = 'ABCDEFGHJKLMNOP'; // no 'I', 15 letters
      for(let i=0;i<N;i++){
        ctx.fillText(letters[i], gx(i), oy*0.5);
        ctx.fillText(String(N-i), ox*0.5, gy(i));
      }
    }

    // keyboard cursor (only when it's your move)
    if(showCursor && !gameOver && !thinking && turn===human && board[idx(cursor.x,cursor.y)]===EMPTY){
      const px=gx(cursor.x), py=gy(cursor.y), r=radius*1.15;
      ctx.strokeStyle = 'rgba(239,58,58,0.9)'; ctx.lineWidth = 2;
      ctx.strokeRect(px-r, py-r, r*2, r*2);
    }

    // hover ghost (mouse only, your move)
    if(hover && !gameOver && !thinking && turn===human && board[idx(hover[0],hover[1])]===EMPTY){
      drawStone(gx(hover[0]), gy(hover[1]), human, radius, 0.32);
    }

    // stones
    for(let y=0;y<N;y++){
      for(let x=0;x<N;x++){
        const v = board[idx(x,y)];
        if(v===EMPTY) continue;
        let r = radius;
        if(anim && anim.x===x && anim.y===y){
          const t = Math.min(1, (performance.now()-anim.t0)/150);
          const e = 1 - Math.pow(1-t, 3);
          r = radius * (0.5 + 0.5*e);
        }
        drawStone(gx(x), gy(y), v, r);
      }
    }

    // last-move marker
    if(lastMove && !winLine){
      const [lx,ly]=lastMove;
      ctx.beginPath(); ctx.arc(gx(lx), gy(ly), radius*0.32, 0, Math.PI*2);
      ctx.strokeStyle = '#ef3a3a'; ctx.lineWidth = Math.max(2, radius*0.14);
      ctx.stroke();
    }

    // winning line
    if(winLine && winLine.length>=2){
      const pulse = reduceMotion ? 1 : (0.65 + 0.35*Math.abs(Math.sin(performance.now()/320)));
      const a=winLine[0], b=winLine[winLine.length-1];
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.strokeStyle = '#ef3a3a';
      ctx.lineWidth = Math.max(3, radius*0.5);
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(gx(a[0]),gy(a[1])); ctx.lineTo(gx(b[0]),gy(b[1])); ctx.stroke();
      ctx.globalAlpha = 1;
      for(const [wx,wy] of winLine){
        ctx.beginPath(); ctx.arc(gx(wx),gy(wy), radius*1.02, 0, Math.PI*2);
        ctx.lineWidth = Math.max(2, radius*0.16); ctx.strokeStyle = '#ef3a3a'; ctx.stroke();
      }
      ctx.restore();
    }
  }

  /* ============================ input ============================ */
  function pointToCell(clientX, clientY){
    const rect = cv.getBoundingClientRect();
    const px = (clientX - rect.left) * (S / rect.width);
    const py = (clientY - rect.top)  * (S / rect.height);
    const cx = Math.round((px - ox)/cell);
    const cy = Math.round((py - oy)/cell);
    if(!inb(cx,cy)) return null;
    // reject taps far from any intersection (outside the board margins)
    const dx = px - gx(cx), dy = py - gy(cy);
    if(Math.hypot(dx,dy) > cell*0.9) return null;
    return [cx,cy];
  }

  cv.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    cv.focus();
    const c = pointToCell(e.clientX, e.clientY);
    if(!c) return;
    showCursor = false;
    cursor.x = c[0]; cursor.y = c[1];
    humanPlace(c[0], c[1]);
  });

  cv.addEventListener('pointermove', (e)=>{
    if(e.pointerType==='touch') return;             // no ghost on touch
    const c = pointToCell(e.clientX, e.clientY);
    const changed = (!!hover !== !!c) || (c && hover && (c[0]!==hover[0]||c[1]!==hover[1]));
    hover = c;
    if(changed) draw();
  });
  cv.addEventListener('pointerleave', ()=>{ if(hover){ hover=null; draw(); } });

  cv.addEventListener('keydown', (e)=>{
    let handled = true;
    switch(e.key){
      case 'ArrowLeft':  showCursor=true; cursor.x=Math.max(0,cursor.x-1); break;
      case 'ArrowRight': showCursor=true; cursor.x=Math.min(N-1,cursor.x+1); break;
      case 'ArrowUp':    showCursor=true; cursor.y=Math.max(0,cursor.y-1); break;
      case 'ArrowDown':  showCursor=true; cursor.y=Math.min(N-1,cursor.y+1); break;
      case 'Enter': case ' ':
        showCursor=true; humanPlace(cursor.x, cursor.y); break;
      default: handled=false;
    }
    if(handled){ e.preventDefault(); draw(); }
  });

  // global shortcuts
  window.addEventListener('keydown', (e)=>{
    if(e.target && (e.target.tagName==='BUTTON')) return;
    const k = e.key.toLowerCase();
    if(k==='n'){ newGame(); }
    else if(k==='u'){ undo(); }
  });

  /* ---------- buttons ---------- */
  diffWrap.addEventListener('click', (e)=>{
    const b = e.target.closest('button');
    if(!b) return;
    difficulty = b.dataset.diff;
    updateUI();
    // difficulty affects only the AI's next move; no need to reset the game
  });

  sideBtn.addEventListener('click', ()=>{
    human = (human===BLACK)?WHITE:BLACK;
    ai = (human===BLACK)?WHITE:BLACK;
    newGame();   // colours/first-move change means a fresh board
  });

  newBtn.addEventListener('click', ()=> newGame());
  undoBtn.addEventListener('click', ()=> undo());
  ovPrimary.addEventListener('click', ()=> newGame());
  ovClose.addEventListener('click', ()=> hideOverlay());

  window.addEventListener('resize', resize);
  // some mobile browsers fire resize late on rotate / url-bar changes
  window.addEventListener('orientationchange', ()=> setTimeout(resize, 200));

  /* ============================ boot ============================ */
  LINES = buildLines();
  resize();
  newGame();

  // Deliberate contract note: has_leaderboard=false for this game, so NO
  // window.parent.postMessage({type:"batchly-score",...}) is ever sent.
})();
</script>

<style data-batchly="hit-targets">/* Batchly mobile hit-target shim: >=44px tappables on phones/touch only */
@media (max-width: 900px), (pointer: coarse){
  #bar button,#diff button{min-height:44px;min-width:44px;touch-action:manipulation}
  #ovBtns button{min-height:44px;touch-action:manipulation}
}
</style>
</body>
</html>
